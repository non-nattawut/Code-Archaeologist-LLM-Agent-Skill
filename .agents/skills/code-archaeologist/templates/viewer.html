<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__</title>
<style>
  :root {
    /* Instrument: near-black ground, hairline rules, one amber accent. Data colours
       (layers, risk, languages) are the only saturated things on screen. */
    --bg: #08090b; --panel: #0b0d10; --panel2: #0d0f12; --border: #1b1f26;
    --rule: #14171d; --text: #c9ced7; --bright: #e6e9ee; --muted: #6b727e; --dim: #444b57;
    --accent: #d99f4a; --link: #6ea8fe;
    --danger: #e0574f; --warn: #e0a33e; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12px; line-height: 1.45; font-variant-numeric: tabular-nums; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #1d222a; }

  /* Rail widths are variables so the drag handles can move them; a dragged width is an
     inline style on #app, which survives a map switch because nothing re-renders #app. */
  #app { display: grid; grid-template-columns: var(--lw) 1fr var(--rw); grid-template-rows: auto 1fr;
    height: 100%; position: relative; --lw: 296px; --rw: 376px; }

  /* A 9px grab strip straddling the rail border, drawn only on hover/drag. */
  .rsz { position: absolute; top: 44px; bottom: 0; width: 9px; z-index: 6; cursor: col-resize; }
  .rsz::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; }
  .rsz:hover::before, .rsz.drag::before { background: var(--accent); }
  #rszL { left: calc(var(--lw) - 4px); }
  #rszR { right: calc(var(--rw) - 4px); }
  #head { grid-column: 1 / -1; display: flex; align-items: stretch; height: 44px;
    background: var(--panel); border-bottom: 1px solid var(--border); overflow: hidden; }
  #head .pill { margin-left: auto; align-self: center; padding: 0 16px 0 18px; white-space: nowrap;
    flex: none; }
  .mapswitch { display: flex; flex: none; }
  .mapswitch button { display: flex; align-items: center; gap: 8px; padding: 0 16px;
    color: var(--muted); border-right: 1px solid var(--border); }
  .mapswitch button:hover { color: var(--text); }
  .mapswitch button.on { color: var(--bright); box-shadow: inset 0 -2px 0 var(--accent); }
  aside { background: var(--panel); overflow-y: auto; }
  /* The rail does not scroll: fixed blocks keep their size, the explorer takes what is
     left and scrolls inside itself. One scroll region per pane, never two nested. */
  #left { border-right: 1px solid var(--border); display: flex; flex-direction: column;
    overflow: hidden; }
  #left > * { flex: none; }
  #left > .sect.grow { flex: 1; min-height: 96px; display: flex; flex-direction: column;
    overflow: hidden; }
  #right { border-left: 1px solid var(--border); }
  #center { display: flex; flex-direction: column; min-width: 0; }

  /* ---- left ---- */
  .brand { display: flex; align-items: center; gap: 10px; width: var(--lw); padding: 0 16px;
    border-right: 1px solid var(--border); flex: none; }
  .brand .dot { width: 18px; height: 18px; border: 1px solid var(--accent); display: grid;
    place-items: center; color: var(--accent); font-weight: 500; font-size: 11px; flex: none; }
  .brand b { letter-spacing: .04em; font-size: 12px; font-weight: 500; color: var(--bright);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
  /* One line, always: the header is a fixed 44px and must never clip its own text. */
  #mapSub { align-self: center; min-width: 0; padding-left: 16px; color: var(--muted);
    font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .health { padding: 16px; border-bottom: 1px solid var(--border); }
  .health .score { font-size: 30px; font-weight: 700; line-height: 1; color: var(--bright);
    display: flex; align-items: baseline; gap: 8px; }
  .health .label { color: var(--muted); font-size: 10px; text-transform: uppercase;
    letter-spacing: .14em; }
  .health .why { color: var(--muted); font-size: 11px; margin-top: 8px; }
  #ring { display: block; margin: 12px 0 2px; }

  .sect { padding: 16px; border-bottom: 1px solid var(--border); }
  .sect > h3 { margin: 0 0 12px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 400; display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none; }
  .sect > h3:hover { color: var(--text); }
  .sect > h3::before { content: "3"; width: 9px; font-size: 8px; color: var(--dim); }
  .sect.folded > h3 { margin-bottom: 0; }
  .sect.folded > h3::before { content: "+"; }
  .sect.folded > :not(h3) { display: none; }
  .sect > h3 .n { margin-left: auto; color: var(--dim); font-size: 10px; letter-spacing: 0; }
  .modes { display: flex; border: 1px solid var(--border); }
  .modes button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 0; color: var(--muted); border-left: 1px solid var(--border); }
  .modes button:first-child { border-left: none; }
  .modes button svg { flex: none; }
  .modes button:hover { color: var(--text); background: var(--rule); }
  .modes button.on { background: var(--rule); color: var(--bright); box-shadow: inset 0 -2px 0 var(--accent); }
  .modes button[disabled] { opacity: .3; cursor: not-allowed; }

  /* census rows: a readout, not a scoreboard */
  .tiles { display: flex; flex-direction: column; }
  .tile { display: flex; align-items: baseline; gap: 10px; padding: 4px 0; }
  .tile b { margin-left: auto; font-weight: 500; color: var(--bright); font-size: 13px; }
  .tile.alt b { color: var(--warn); }
  .tile span { font-size: 12px; color: var(--muted); }

  .loc { padding-top: 14px; }
  .loc b { font-weight: 500; color: var(--bright); font-size: 13px; }
  .bar { display: flex; height: 2px; overflow: hidden; margin: 10px 0 7px; }
  .bar i { display: block; height: 100%; }
  .langs { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted); }
  .langs span { display: inline-flex; align-items: center; gap: 6px; }
  .langs i { width: 7px; height: 7px; }

  #filterChip { display: none; align-items: center; gap: 8px; width: 100%; margin-bottom: 8px;
    padding: 6px 9px; border: 1px solid var(--border); color: var(--muted); font-size: 11px; }
  #filterChip.on { display: flex; }
  #search { width: 100%; background: var(--panel2); color: var(--text); font: inherit; font-size: 12px;
    border: 1px solid var(--border); padding: 7px 9px; outline: none; }
  #search::placeholder { color: var(--dim); }
  #search:focus { border-color: var(--accent); }
  .tree { margin-top: 12px; }
  .sect.grow .tree { flex: 1; min-height: 0; overflow-y: auto; margin-right: -6px;
    padding-right: 6px; }
  .row { display: flex; align-items: center; gap: 7px; padding: 3px 6px 3px 4px;
    cursor: pointer; white-space: nowrap; border-left: 2px solid transparent; }
  .row:hover { background: var(--rule); }
  .row.on { background: var(--rule); border-left-color: var(--accent); color: var(--bright); }
  .row .name { overflow: hidden; text-overflow: ellipsis; }
  .row .dir { color: var(--bright); }
  .row .n { margin-left: auto; display: flex; align-items: center; gap: 6px;
    color: var(--dim); font-size: 11px; }
  /* Its own hit target: the twisty expands, the rest of the row filters. Negative margins
     buy a clickable area bigger than the glyph without moving the row. */
  .row .tw { width: 9px; color: var(--muted); font-size: 8px; flex: none; text-align: center;
    margin: -4px 0 -4px -4px; padding: 4px 0 4px 4px; }
  .row .tw:hover { color: var(--accent); }
  .row .n i { width: 5px; height: 5px; background: var(--danger); flex: none; }

  /* ---- center ---- */
  .toolbar { display: flex; align-items: stretch; height: 34px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  .tbtn { display: flex; align-items: center; gap: 6px; padding: 0 12px; color: var(--muted);
    border-right: 1px solid var(--border); font-size: 12px; }
  .tbtn:hover { color: var(--text); background: var(--rule); }
  .tbtn.on { color: var(--bright); background: var(--rule); box-shadow: inset 0 -2px 0 var(--accent); }
  .views { display: flex; }
  .views button { padding: 0 14px; color: var(--muted); }
  .views button:hover { color: var(--text); background: var(--rule); }
  .views button.on { color: var(--bright); box-shadow: inset 0 -2px 0 var(--accent); }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px;
    font-size: 11.5px; color: var(--muted); cursor: pointer; border-left: 1px solid var(--border); }
  .toolbar label:hover { color: var(--text); }
  /* The native control paints a white box the palette has no room for: same hairline
     border as every other chrome element, amber only when it is actually on. */
  .toolbar label input { appearance: none; -webkit-appearance: none; margin: 0; flex: none;
    width: 12px; height: 12px; background: var(--panel2); border: 1px solid var(--dim);
    display: grid; place-items: center; cursor: pointer; }
  .toolbar label:hover input { border-color: var(--muted); }
  .toolbar label input:checked { background: var(--accent); border-color: var(--accent); }
  /* The tick is drawn, not a glyph, so it cannot pick up a font the machine lacks. */
  .toolbar label input:checked::before { content: ""; width: 6px; height: 3px; margin-top: -1px;
    border: solid var(--bg); border-width: 0 0 1.5px 1.5px; transform: rotate(-45deg); }
  .toolbar label input:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  .toolbar .sp { margin-left: auto; }
  /* The overflow menu holds the least-used controls (zoom, fit, PNG): that took the full
     row from ~897px to ~770px. Below that, the compact row (further down) moves the three
     toggles in here too, needing ~527px -- so with both rails at their minimum the toolbar
     never clips above ~987px wide (was ~1270px, and ~1360px before the menu). Measured in
     phase 5, not estimated. The menu opens down over the stage, amber only while open, and
     closes on an outside click or Escape -- but not when a toggle inside it is clicked. */
  .more { position: relative; display: flex; }
  .more > .tbtn { border-right: none; border-left: 1px solid var(--border); }
  .menu { position: absolute; top: 100%; right: 0; z-index: 30; min-width: 150px;
    background: var(--panel); border: 1px solid var(--border); padding: 4px 0; }
  .menu button { display: block; width: 100%; text-align: left; padding: 6px 12px;
    font-size: 12px; color: var(--muted); }
  .menu button:hover { color: var(--text); background: var(--rule); }
  /* Compact toolbar: when the centre is narrower than the full row, the three toggles
     move into the menu (the same elements, re-parented), so the row never clips. */
  .toggles { display: flex; }
  .menu-toggles:empty { display: none; }
  .menu-toggles { border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 4px; }
  .menu label { display: flex; border-left: none; padding: 6px 12px; }

  #stage { position: relative; flex: 1; min-height: 0; }
  #graph, #matrix, #treemap { position: absolute; inset: 0; }
  #matrix, #treemap { display: none; overflow: auto; background: var(--bg); }
  #treemap { padding: 16px; }
  .tm { position: relative; width: 100%; height: 100%; }
  .tmf { position: absolute; border: 1px solid rgba(0,0,0,.5); overflow: hidden; cursor: pointer;
    padding: 4px 6px; font-size: 10px; line-height: 1.25; color: #06121a; }
  .tmf:hover { outline: 1px solid var(--bright); }
  .tmg { position: absolute; border: 1px solid var(--border); }
  .tmg > b { position: absolute; top: -8px; left: 8px; background: var(--bg); padding: 0 6px;
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 400; }

  .status { display: flex; gap: 22px; align-items: center; padding: 0 14px; height: 30px;
    border-top: 1px solid var(--border); background: var(--panel); font-size: 11px; color: var(--muted); }
  .pill { color: var(--muted); }
  .pill b { color: var(--bright); font-weight: 500; }
  .pill:empty { display: none; }
  .pill.hot { color: var(--danger); }
  .pill.hot b { color: var(--danger); }

  /* ---- right ---- */
  .tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: var(--panel); z-index: 5; height: 34px; }
  .tabs button { flex: 1; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); border-left: 1px solid var(--border); }
  .tabs button:first-child { border-left: none; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--bright); box-shadow: inset 0 -2px 0 var(--accent); }
  .tabs .badge { margin-left: 6px; }
  .badge { display: inline-block; padding: 0 5px; font-size: 10px; background: #171b22;
    color: var(--muted); }
  .badge.crit, .badge.high { background: #2a1614; color: #f0857c; }
  .badge.med { background: #2a2213; color: #e3b341; }
  .badge.low { background: #12202e; color: #79c0ff; }
  .pad { padding: 16px; }
  #backBtn { display: none; width: 100%; margin-bottom: 14px; padding: 7px 9px; text-align: left;
    border: 1px solid var(--border); color: var(--muted); font-size: 11.5px; }
  #backBtn:hover { color: var(--text); background: var(--rule); }
  #backBtn.on { display: block; }
  h2.node { margin: 0 0 6px; font-size: 15px; font-weight: 500; color: var(--bright);
    word-break: break-all; }
  .sub { color: var(--muted); font-size: 11px; word-break: break-all; }
  .chips { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 4px; }
  .chip { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .chip i { width: 7px; height: 7px; }

  .acc { border-top: 1px solid var(--border); margin-top: 14px; }
  .acc > summary { list-style: none; cursor: pointer; padding: 12px 0 10px; display: flex;
    align-items: center; gap: 9px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); }
  .acc > summary:hover { color: var(--text); }
  .acc > summary::-webkit-details-marker { display: none; }
  .acc > summary::before { content: "+"; font-size: 11px; color: var(--dim); }
  .acc[open] > summary::before { content: "−"; }
  .acc > summary .grow { margin-left: auto; letter-spacing: 0; text-transform: none; }
  .acc .body { padding: 0 0 14px; }
  .meter { height: 2px; background: var(--rule); overflow: hidden; margin: 8px 0; }
  .meter i { display: block; height: 100%; background: var(--warn); }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 12px; }
  .kv + .kv { border-top: 1px solid var(--rule); }
  .kv span { color: var(--muted); }
  .kv b { font-weight: 500; color: var(--bright); }
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px;
    cursor: pointer; }
  .item + .item { border-top: 1px solid var(--rule); }
  .item:hover .mono { color: var(--accent); }
  .item .grow { margin-left: auto; display: flex; gap: 6px; }
  .mono, code { font-family: inherit; }
  .link { color: var(--link); cursor: pointer; }
  .link:hover { text-decoration: underline; }
  .empty { color: var(--dim); font-size: 12px; }
  .doc { font-size: 12.5px; line-height: 1.6; margin: 12px 0 0; color: var(--text); }
  .issue { border-left: 2px solid var(--danger); padding: 2px 0 2px 10px; margin: 10px 0;
    font-size: 12px; cursor: pointer; }
  .issue.med { border-color: var(--warn); }
  .issue.low { border-color: var(--link); }
  .issue .m { color: var(--muted); font-size: 11px; }
  .grp { margin: 18px 0 8px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); }

  /* Narrower default rails, but only until the user drags one: a dragged width is an
     inline style on #app, which outranks this. */
  @media (max-width: 1180px) {
    #app { --lw: 244px; --rw: 320px; }
  }
  /* Too short to give the explorer a usable height: let the rail scroll as a whole
     rather than squeezing it to nothing. */
  @media (max-height: 620px) {
    #left { overflow-y: auto; }
    #left > .sect.grow { flex: none; overflow: visible; }
    .sect.grow .tree { overflow: visible; }
  }
</style>
<script>__VENDOR_JS__</script>
</head>
<body>
<div id="app">
  <header id="head">
    <div class="brand"><span class="dot">C</span><b>CODE ARCHAEOLOGIST</b></div>
    <div class="mapswitch" id="mapSwitch"></div>
    <span id="mapSub"></span>
    <span class="pill" id="mapGrade"></span>
  </header>

  <aside id="left">
    <div class="health">
      <div class="score" id="healthScore">—</div>
      <div class="label">Health score</div>
      <svg width="264" height="30" viewBox="0 0 264 30" id="ring"></svg>
      <div class="why" id="healthWhy"></div>
    </div>

    <div class="sect">
      <h3>Color by</h3>
      <div class="modes" id="colorModes"></div>
      <div class="langs" id="legend" style="margin-top:10px"></div>
    </div>

    <div class="sect">
      <h3>Census</h3>
      <div class="tiles" id="tiles"></div>
      <div class="loc" id="locBox"></div>
    </div>

    <div class="sect grow">
      <h3>Explorer<span class="n" id="treeCount"></span></h3>
      <button id="filterChip"><b>×</b> <span id="filterName"></span></button>
      <input id="search" placeholder="Search node…  (press /)" autocomplete="off" />
      <div class="tree" id="tree"></div>
    </div>
  </aside>

  <main id="center">
    <div class="toolbar">
      <button class="tbtn" id="reset" title="Reset layout, selection &amp; filter"><svg width="12" height="12"
        viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path
        d="M13.5 8a5.5 5.5 0 1 1-1.9-4.2M13.5 1.5v3.2h-3.2"/></svg></button>
      <div class="views" id="views"></div>
      <span class="sp"></span>
      <span class="toggles" id="toggles">
        <label><input type="checkbox" id="hulls" checked /> Folders</label>
        <label><input type="checkbox" id="blast" /> Blast radius</label>
        <label id="testsToggle" style="display:none"><input type="checkbox" id="showTests" checked /> Tests</label>
      </span>
      <div class="more" id="more">
        <button class="tbtn" id="moreBtn" title="Zoom, fit and export" aria-haspopup="true"
          aria-expanded="false"><svg width="12" height="12" viewBox="0 0 16 16"
          fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle
          cx="13" cy="8" r="1.4"/></svg></button>
        <div class="menu" id="moreMenu" hidden>
          <div class="menu-toggles" id="menuToggles"></div>
          <button id="zoomIn">Zoom in</button>
          <button id="zoomOut">Zoom out</button>
          <button id="zoomFit">Fit to screen</button>
          <button id="png">Export PNG</button>
        </div>
      </div>
    </div>
    <div id="stage">
      <div id="graph"></div>
      <canvas id="matrix"></canvas>
      <div id="treemap"><div class="tm" id="tmRoot"></div></div>
    </div>
    <div class="status">
      <span class="pill" id="stFiles"></span>
      <span class="pill" id="stNodes"></span>
      <span class="pill" id="stLinks"></span>
      <span class="pill hot" id="stAffected"></span>
      <span class="pill" id="stSel" style="margin-left:auto"></span>
    </div>
  </main>

  <aside id="right">
    <div class="tabs" id="tabs"></div>
    <div class="pad" id="panel"></div>
  </aside>

  <div class="rsz" id="rszL" title="Drag to resize the left rail"></div>
  <div class="rsz" id="rszR" title="Drag to resize the right panel"></div>
</div>

<script>
// ---------------------------------------------------------------- data
// Every map (structure + flow) is embedded; the header switch swaps between them.
const MAPS = __MAPS_DATA__;                 // { name: {label, title, graph, report} }
const MAP_NAMES = Object.keys(MAPS);
let mapName = MAP_NAMES.includes("flow") ? "flow" : MAP_NAMES[0];

// All of this is rebuilt by loadMap() whenever the active map changes.
let GRAPH, REPORT, ANALYSIS, HEALTH, FINDINGS, CHURN, FILE_META, FILE_STATS, HAS_CHURN, DUPES, BLOCKS;
let nodes, byId, links, isFlow, OUT_LABEL, IN_LABEL, outAdj, inAdj;
let filesIndex, folders, issuesByNode, issuesByFile, MAX, treeRoot, openDirs;

const fileOf = (n) => String(n.source || "").split(":")[0] || "(unknown)";
const lineOf = (n) => { const p = String(n.source || "").split(":")[1]; return p ? +p : null; };
const dirOf = (path) => { const i = path.lastIndexOf("/"); return i < 0 ? "(root)" : path.slice(0, i); };
const baseOf = (path) => path.slice(path.lastIndexOf("/") + 1);

let EDGES = [], HAS_TESTS = false, allFolders = [];

function loadMap(name) {
  mapName = name;
  GRAPH = MAPS[name].graph;
  REPORT = MAPS[name].report || {};
  ANALYSIS = REPORT.analysis || {};
  HEALTH = ANALYSIS.health || null;
  FINDINGS = (REPORT.security || {}).findings || [];
  DUPES = ((REPORT.duplicates || {}).clusters) || [];
  BLOCKS = ((REPORT.duplicates || {}).blocks) || [];
  CHURN = ((REPORT.insights || {}).nodes) || {};
  FILE_META = ((REPORT.files || {}).files) || {};
  FILE_STATS = REPORT.files || {};
  HAS_CHURN = Object.keys(CHURN).length > 0;

  // Test nodes are real nodes -- they call production code, which is how "covered by"
  // works -- but they are noise on an architecture map, so they can be switched off.
  HAS_TESTS = GRAPH.nodes.some((n) => n.layer === "test");
  const showTests = !HAS_TESTS || el("showTests").checked;
  nodes = GRAPH.nodes.filter((n) => showTests || n.layer !== "test").map((n) => ({ ...n }));
  byId = new Map(nodes.map((n) => [n.id, n]));
  EDGES = GRAPH.edges.filter((e) => byId.has(e.source) && byId.has(e.target));
  links = EDGES.map((e) => ({ source: e.source, target: e.target, type: e.type }));
  isFlow = GRAPH.edges.some((e) => e.type === "calls");
  OUT_LABEL = isFlow ? "Calls" : "References";
  IN_LABEL = isFlow ? "Called by" : "Referenced by";

  outAdj = new Map(); inAdj = new Map();
  nodes.forEach((n) => { outAdj.set(n.id, []); inAdj.set(n.id, []); });
  EDGES.forEach((e) => { outAdj.get(e.source)?.push(e.target); inAdj.get(e.target)?.push(e.source); });

  filesIndex = new Map();                   // file -> {nodes:[], lines, lang}
  nodes.forEach((n) => {
    const f = fileOf(n);
    if (!filesIndex.has(f)) filesIndex.set(f, { nodes: [], ...(FILE_META[f] || {}) });
    filesIndex.get(f).nodes.push(n.id);
  });
  folders = [...new Set(nodes.map((n) => dirOf(fileOf(n))))].sort();
  // Colours are keyed off this one, so it must not change with the Tests toggle.
  allFolders = [...new Set(GRAPH.nodes.map((n) => dirOf(fileOf(n))))].sort().filter((f) => !isTestFolder(f));

  issuesByNode = new Map(); issuesByFile = new Map();
  FINDINGS.forEach((f) => {
    if (f.node && byId.has(f.node)) {
      if (!issuesByNode.has(f.node)) issuesByNode.set(f.node, []);
      issuesByNode.get(f.node).push(f);
    }
    if (!issuesByFile.has(f.file)) issuesByFile.set(f.file, []);
    issuesByFile.get(f.file).push(f);
  });

  MAX = { commits: maxOf("commits"), risk: maxOf("risk") };
  buildTree();
}

// ---------------------------------------------------------------- helpers
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (n) => (n == null ? "—" : n.toLocaleString());
const el = (id) => document.getElementById(id);
const SEV_CLASS = { high: "high", medium: "med", low: "low" };

// Test code is green wherever it appears -- the node, its folder area, the legend.
// Kept out of FOLDER_COLORS so a normal folder can never be handed the same green.
const TEST_COLOR = "#57ab5a";

// Why a node's edges are known to be incomplete. Mirrors taxonomy.PRECISION_NOTES
// -- the explorer must not invent its own wording for a field the graph defines.
// The general caveat (every language's edges are a lower bound) is stated once in
// the header, not per node, because it is true of every node.
const PRECISION_NOTES = {
  "interface-dispatch": "Calls through an interface stop at its declaration - which implementation runs is not knowable from the source.",
  "overloads": "An overload set is folded into one node, so which signature is called is ambiguous.",
  "name-matched": "JS/TS, Ruby, PHP, Elixir and Groovy calls are matched by name, so a call through an object with no declared type was dropped.",
};
const LAYER_COLORS = {
  controller: "#f778ba", endpoint: "#f778ba", service: "#6ea8fe", repository: "#3fb950",
  model: "#e3b341", client: "#39c5cf", config: "#a371f7", ui: "#f0883e", test: TEST_COLOR,
  function: "#adbac7", module: "#adbac7", unknown: "#8b98ad"
};
const FOLDER_COLORS = ["#6ea8fe", "#f778ba", "#3fb950", "#e3b341", "#a371f7", "#39c5cf",
                       "#f0883e", "#db6d28", "#8ddb8c", "#c297ff", "#ff7b72", "#7ee787"];
// The language-mix bar. Since phase 7 eighteen languages have graphs, and eighteen
// hues cannot stay distinguishable on this ground, so languages of one family share
// a colour and the label beside each swatch names the language. The family hues sit
// outside FOLDER_COLORS and the layer palette, so none of them means two things.
const JVM = "#b08968", DOTNET = "#8e7cc3", NATIVE = "#d16d6d", DYNAMIC = "#9fb0c4";
const LANG_COLORS = { py: "#6ea8fe", js: "#e3b341", jsx: "#f0883e", ts: "#39c5cf",
                      tsx: "#a371f7", java: JVM, kotlin: JVM, scala: JVM, groovy: JVM,
                      csharp: DOTNET, c: NATIVE, cpp: NATIVE, rust: NATIVE, swift: NATIVE,
                      ruby: DYNAMIC, php: DYNAMIC, elixir: DYNAMIC, go: "#5fb3a1",
                      dart: "#c9a0dc", other: "#8b98ad" };
const COOL = [45, 63, 94], HOT = [248, 81, 73];
const heat = (v, max) => {
  const t = max > 0 ? Math.min(1, v / max) : 0;
  const c = COOL.map((x, i) => Math.round(x + (HOT[i] - x) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
};
const metrics = (id) => CHURN[id] || {};
const maxOf = (f) => Math.max(0, ...nodes.map((n) => metrics(n.id)[f] || 0));
// Index into ALL folders of the map, not the visible ones: hiding the test folder
// used to shift every colour after it, so "pink" stopped meaning the same folder.
const isTestFolder = (path) => (path || "").split("/").some((p) =>
  ["test", "tests", "__tests__", "spec", "specs", "testing"].includes(p.toLowerCase()));
const folderColor = (path) => (isTestFolder(path) ? TEST_COLOR
  : FOLDER_COLORS[Math.max(0, allFolders.indexOf(path)) % FOLDER_COLORS.length]);

let colorMode = "layer";
function colorFor(n) {
  if (colorMode === "folder") return folderColor(dirOf(fileOf(n)));
  if (colorMode === "churn") return heat(metrics(n.id).commits || 0, MAX.commits);
  if (colorMode === "risk") return heat(metrics(n.id).risk || 0, MAX.risk);
  return LAYER_COLORS[n.layer] || LAYER_COLORS[n.kind] || LAYER_COLORS.unknown;
}
const worstIssue = (id) => {
  const l = issuesByNode.get(id) || [];
  return l.some((f) => f.severity === "high") ? "high" : (l.length ? l[0].severity : null);
};
// Transitive reach in one direction (the blast radius, excluding the start).
function reach(id, adj) {
  const seen = new Set(), queue = [[id, 0]];
  let depth = 0;
  while (queue.length) {
    const [cur, d] = queue.shift();
    (adj.get(cur) || []).forEach((next) => {
      if (!seen.has(next)) { seen.add(next); depth = Math.max(depth, d + 1); queue.push([next, d + 1]); }
    });
  }
  seen.delete(id);
  return { set: seen, depth };
}

// ---------------------------------------------------------------- left: explorer tree
function buildTree() {
  treeRoot = { name: "root", dirs: new Map(), files: [], count: 0 };
  filesIndex.forEach((meta, path) => {
    const parts = path.split("/");
    let cur = treeRoot;
    cur.count += meta.nodes.length;
    parts.slice(0, -1).forEach((part) => {
      if (!cur.dirs.has(part))
        cur.dirs.set(part, { name: part, dirs: new Map(), files: [], count: 0, path: "" });
      cur = cur.dirs.get(part);
      cur.count += meta.nodes.length;
    });
    cur.files.push({ name: parts[parts.length - 1], path, count: meta.nodes.length });
  });
  (function setPaths(node, prefix) {
    node.dirs.forEach((d, name) => {
      d.path = prefix ? `${prefix}/${name}` : name;
      setPaths(d, d.path);
    });
  })(treeRoot, "");
  // Start with every folder that actually holds code expanded.
  openDirs = new Set(folders.flatMap((f) => {
    const parts = f.split("/");
    return parts.map((_, i) => parts.slice(0, i + 1).join("/"));
  }));
}

function renderTree() {
  const out = [];
  const walk = (node, depth) => {
    [...node.dirs.values()].sort((a, b) => a.name.localeCompare(b.name)).forEach((d) => {
      const open = openDirs.has(d.path);
      out.push(`<div class="row ${fileFilter === d.path ? "on" : ""}" data-dir="${esc(d.path)}"
        style="padding-left:${depth * 12 + 4}px"><span class="tw">${open ? "–" : "+"}</span>
        <span class="name dir">${esc(d.name)}/</span><span class="n">${d.count}</span></div>`);
      if (open) walk(d, depth + 1);
    });
    node.files.sort((a, b) => a.name.localeCompare(b.name)).forEach((f) => {
      const bad = (issuesByFile.get(f.path) || []).length;
      out.push(`<div class="row ${fileFilter === f.path ? "on" : ""}" data-file="${esc(f.path)}"
        style="padding-left:${depth * 12 + 17}px">
        <span class="name">${esc(f.name)}</span>
        <span class="n">${bad ? `<i title="${bad} risk finding(s)"></i>` : ""}${f.count}</span></div>`);
    });
  };
  walk(treeRoot, 0);
  el("tree").innerHTML = out.join("");
  el("treeCount").textContent = `${filesIndex.size} files`;
  // The twisty owns expand/collapse on its own, so a folder can be closed without also
  // changing the filter - which is what folding it used to be tangled up with.
  el("tree").querySelectorAll("[data-dir] .tw").forEach((t) => t.addEventListener("click", (e) => {
    e.stopPropagation();
    const p = t.parentElement.dataset.dir;
    if (openDirs.has(p)) openDirs.delete(p); else openDirs.add(p);
    renderTree();
  }));
  el("tree").querySelectorAll("[data-dir]").forEach((r) => r.addEventListener("click", () => {
    const p = r.dataset.dir;
    openDirs.add(p);
    setFilter(fileFilter === p ? null : p);
  }));
  el("tree").querySelectorAll("[data-file]").forEach((r) => r.addEventListener("click", () => {
    const p = r.dataset.file;
    setFilter(fileFilter === p ? null : p);
    if (fileFilter) showFile(p);
  }));
}

function inFilter(n) {
  if (!fileFilter) return true;
  const f = fileOf(n);
  return f === fileFilter || f.startsWith(fileFilter + "/");
}
function setFilter(path) {
  fileFilter = path;
  el("filterChip").classList.toggle("on", !!path);
  el("filterName").textContent = path ? `Clear filter: ${baseOf(path)}` : "";
  renderTree(); repaint(); updateStatus();
  if (view === "matrix") renderMatrix();
  if (view === "treemap") renderTreemap();
}
el("filterChip").addEventListener("click", () => setFilter(null));

// ---------------------------------------------------------------- graph
const Graph = ForceGraph()(el("graph"))
  .backgroundColor("#0b0e14")
  .graphData({ nodes: [], links: [] })
  .nodeId("id")
  .nodeRelSize(5)
  .onDagError(() => {})            // cycles are fine: just fall back to a free layout
  .linkColor((l) => highlightLinks.has(l) ? "rgba(63,224,160,.9)"
    : (l.type === "http" ? "rgba(226,116,161,.5)" : "rgba(139,152,173,.16)"))
  .linkWidth((l) => highlightLinks.has(l) ? 2 : 1)
  .linkLineDash((l) => l.type === "http" ? [4, 3] : null)
  .linkDirectionalArrowLength(4)
  .linkDirectionalArrowRelPos(1)
  .linkDirectionalParticles((l) => highlightLinks.has(l) ? 3 : 0)
  .linkDirectionalParticleWidth(2)
  .onRenderFramePre(drawHulls)
  .nodeCanvasObject(drawNode)
  .onNodeClick((n) => selectNode(n.id, true))
  .onBackgroundClick(() => clearSelection());

const repaint = () => Graph.nodeRelSize(Graph.nodeRelSize());
const degree = (id) => outAdj.get(id).length + inAdj.get(id).length;

function drawNode(node, ctx, scale) {
  const r = 4 + Math.min(degree(node.id), 8) * 0.7;
  const dim = (selected && !highlightNodes.has(node.id)) || !inFilter(node);
  ctx.globalAlpha = dim ? 0.15 : 1;
  ctx.beginPath();
  ctx.arc(node.x, node.y, r, 0, 2 * Math.PI);
  ctx.fillStyle = colorFor(node);
  ctx.fill();
  const issue = worstIssue(node.id);
  if (node.id === selected) {
    ctx.lineWidth = 2 / scale; ctx.strokeStyle = "#ffffff"; ctx.stroke();
  } else if (issue) {
    ctx.lineWidth = 1.5 / scale;
    ctx.strokeStyle = issue === "high" ? "#f85149" : "#e3b341";
    ctx.stroke();
  }
  const fs = Math.max(3, 11 / scale);
  ctx.font = `${fs}px ui-sans-serif, system-ui`;
  ctx.fillStyle = dim ? "rgba(215,221,232,.3)" : "#d7dde8";
  ctx.fillText(node.id, node.x + r + 2, node.y + 3.5);
  ctx.globalAlpha = 1;
}

// Convex hull (monotone chain) per folder, drawn behind the nodes.
function hull(points) {
  if (points.length < 3) return points;
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const half = (src) => {
    const out = [];
    for (const pt of src) {
      while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], pt) <= 0) out.pop();
      out.push(pt);
    }
    out.pop();
    return out;
  };
  return half(p).concat(half(p.slice().reverse()));
}

// Folder membership is not position: the force layout puts a node next to what it
// calls, so one folder can land in two places on the canvas. A single hull around
// all of it becomes a sliver stretched across unrelated nodes, which reads as a
// group that is not there -- so split a folder by distance and draw a blob each.
function spatialGroups(pts, radius) {
  const out = [];
  pts.forEach((p) => {
    const near = out.filter((g) => g.some((q) => Math.hypot(q[0] - p[0], q[1] - p[1]) <= radius));
    if (!near.length) { out.push([p]); return; }
    const merged = near.reduce((a, g) => a.concat(g), [p]);
    near.forEach((g) => out.splice(out.indexOf(g), 1));
    out.push(merged);
  });
  return out;
}

// "Close together" only means something relative to how spread the graph is, so
// take it from the layout itself: a few times the typical nearest-neighbor gap.
function groupRadius(all) {
  if (all.length < 3) return 140;
  const gaps = all.map((p, i) => {
    let best = Infinity;
    all.forEach((q, j) => {
      if (i !== j) best = Math.min(best, Math.hypot(p[0] - q[0], p[1] - q[1]));
    });
    return best;
  }).sort((a, b) => a - b);
  return Math.max(80, gaps[Math.floor(gaps.length / 2)] * 4);
}

function drawBlob(ctx, scale, pts, color, pad) {
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  ctx.fillStyle = color + "12";
  ctx.strokeStyle = color + "44";
  ctx.lineWidth = 1 / scale;

  // Grow the hull along each vertex's outward bisector, not away from the centre:
  // on a long thin cluster the radial push is almost parallel to the shape, so the
  // end nodes get no sideways margin and end up sitting on the boundary. The miter
  // (pad / cos) also buys back what the corner-rounding below cuts off.
  const base = hull(pts), n = base.length;
  const unit = (x, y) => { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
  const ring = base.map((p, i) => {
    const prev = base[(i - 1 + n) % n], next = base[(i + 1) % n];
    const e1 = unit(p[0] - prev[0], p[1] - prev[1]);
    const e2 = unit(next[0] - p[0], next[1] - p[1]);
    let n1 = [e1[1], -e1[0]], n2 = [e2[1], -e2[0]];
    if ((p[0] - cx) * n1[0] + (p[1] - cy) * n1[1] < 0) {   // point them away from the middle
      n1 = [-n1[0], -n1[1]]; n2 = [-n2[0], -n2[1]];
    }
    let b = unit(n1[0] + n2[0], n1[1] + n2[1]);
    const cos = Math.max(0.45, b[0] * n1[0] + b[1] * n1[1]);   // capped, or spikes
    return [p[0] + (b[0] * pad) / cos, p[1] + (b[1] * pad) / cos];
  });
  if (ring.length < 3) {
    // One or two nodes: a padded stroke is the capsule a hull cannot express.
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.lineWidth = pad * 2;
    ctx.beginPath();
    ctx.moveTo(ring[0][0], ring[0][1]);
    ctx.lineTo(ring[ring.length - 1][0], ring[ring.length - 1][1]);
    ctx.strokeStyle = color + "12"; ctx.stroke();
    ctx.lineWidth = 1 / scale; ctx.strokeStyle = color + "44"; ctx.stroke();
    ctx.restore();
    return [cy - pad, cx];
  }
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  ctx.beginPath();
  ctx.moveTo(...mid(ring[ring.length - 1], ring[0]));
  ring.forEach((pt, i) => {
    const next = ring[(i + 1) % ring.length];
    const m = mid(pt, next);
    ctx.quadraticCurveTo(pt[0], pt[1], m[0], m[1]);
  });
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  return [Math.min(...ring.map((p) => p[1])), cx];
}

function drawHulls(ctx, scale) {
  // Only the free layouts group by position; in dag/radial views hulls just overlap.
  if (!el("hulls").checked || !(view === "graph" || view === "cluster")) return;
  const groups = new Map();
  const all = [];
  nodes.forEach((n) => {
    if (n.x == null || !inFilter(n)) return;
    const f = dirOf(fileOf(n));
    if (!groups.has(f)) groups.set(f, []);
    groups.get(f).push([n.x, n.y]);
    all.push([n.x, n.y]);
  });
  const radius = groupRadius(all);
  const pad = 24;
  groups.forEach((pts, folder) => {
    if (pts.length < 2) return;
    const color = folderColor(folder);
    // Every piece gets the label: an unlabelled blob next to another folder's is
    // exactly the confusion this whole change is about.
    const parts = spatialGroups(pts, radius).sort((a, b) => b.length - a.length);
    parts.forEach((part) => {
      const [top, cx] = drawBlob(ctx, scale, part, color, pad);
      ctx.fillStyle = color + "cc";
      ctx.font = `${Math.max(3, 11 / scale)}px ui-monospace, monospace`;
      ctx.textAlign = "center";
      ctx.fillText(folder, cx, top - 6 / scale);
      ctx.textAlign = "left";
    });
  });
}
// ---------------------------------------------------------------- views
const VIEWS = [["graph", "Graph"], ["treemap", "Treemap"], ["matrix", "Matrix"], ["tree", "Tree"],
               ["flow", "Flow"], ["cluster", "Cluster"], ["bundle", "Bundle"]];
el("views").innerHTML = VIEWS.map(([id, label]) =>
  `<button data-view="${id}" class="${id === view ? "on" : ""}">${label}</button>`).join("");
el("views").querySelectorAll("button").forEach((b) =>
  b.addEventListener("click", () => setView(b.dataset.view)));

// Dragging a node pins it (force-graph sets fx/fy and leaves them), so a mangled layout
// has no way back. This is the clean slate the Tests toggle gets for free: it rebuilds the
// node objects, and d3 re-seeds any node with no coordinates. Dropping x/y is what makes
// this a true relayout rather than a nudge - setView alone only unpins and reheats, so the
// simulation would restart from wherever the nodes were dragged to.
function resetLayout() {
  nodes.forEach((n) => {
    delete n.x; delete n.y; delete n.vx; delete n.vy;
    n.fx = null; n.fy = null;
  });
  Graph.graphData({ nodes, links });
  setView(view);                     // re-applies the view's own pinning (bundle, cluster)
}

function setView(next) {
  view = next;
  el("views").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
  el("graph").style.display = (view === "matrix" || view === "treemap") ? "none" : "block";
  el("matrix").style.display = view === "matrix" ? "block" : "none";
  el("treemap").style.display = view === "treemap" ? "block" : "none";
  if (view === "matrix") return renderMatrix();
  if (view === "treemap") return renderTreemap();

  nodes.forEach((n) => { n.fx = null; n.fy = null; });
  Graph.linkCurvature(view === "bundle" ? 0.45 : 0);

  if (view === "tree" || view === "flow") {
    Graph.dagMode(view === "tree" ? "td" : "lr").dagLevelDistance(70);
  } else {
    Graph.dagMode(null);
  }
  if (view === "bundle") layoutBundle();
  if (view === "cluster") layoutCluster();
  Graph.d3ReheatSimulation();
  setTimeout(() => Graph.zoomToFit(500, 60), 350);
}

// Bundle: nodes pinned on a circle, grouped by folder, links drawn as curves that
// bow through the middle — the readable stand-in for hierarchical edge bundling.
function layoutBundle() {
  const ordered = nodes.slice().sort((a, b) => {
    const fa = dirOf(fileOf(a)), fb = dirOf(fileOf(b));
    return fa.localeCompare(fb) || a.id.localeCompare(b.id);
  });
  const R = 40 + ordered.length * 9;
  ordered.forEach((n, i) => {
    const a = (i / ordered.length) * 2 * Math.PI;
    n.fx = Math.cos(a) * R; n.fy = Math.sin(a) * R;
  });
}

// Cluster: folders get anchors on a ring, and each folder's nodes sit on a small
// circle around their anchor. Pinned, so the grouping is stable and readable.
function layoutCluster() {
  const groups = new Map(folders.map((f) => [f, []]));
  nodes.forEach((n) => groups.get(dirOf(fileOf(n)))?.push(n));
  const R = 160 + folders.length * 60;
  [...groups.entries()].forEach(([folder, members], gi) => {
    const a = (gi / Math.max(1, folders.length)) * 2 * Math.PI;
    const [cx, cy] = folders.length === 1 ? [0, 0] : [Math.cos(a) * R, Math.sin(a) * R];
    const r = 30 + members.length * 11;
    members.forEach((n, i) => {
      const t = (i / Math.max(1, members.length)) * 2 * Math.PI;
      n.fx = cx + Math.cos(t) * r;
      n.fy = cy + Math.sin(t) * r;
    });
  });
}

// ---------------------------------------------------------------- matrix view
const MATRIX_CAP = 140;
function matrixNodes() {
  const list = nodes.filter(inFilter).sort((a, b) => degree(b.id) - degree(a.id) || a.id.localeCompare(b.id));
  return list.slice(0, MATRIX_CAP);
}
function renderMatrix() {
  const cv = el("matrix"), list = matrixNodes();
  const idx = new Map(list.map((n, i) => [n.id, i]));
  const pad = 190, cell = Math.max(7, Math.min(20, Math.floor((cv.parentElement.clientHeight - pad - 30) / Math.max(1, list.length))));
  const size = pad + cell * list.length + 20;
  const dpr = window.devicePixelRatio || 1;
  cv.width = size * dpr; cv.height = size * dpr;
  cv.style.width = size + "px"; cv.style.height = size + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0b0e14"; ctx.fillRect(0, 0, size, size);

  const edgeSet = new Set(EDGES.map((e) => e.source + "|" + e.target));
  const httpSet = new Set(EDGES.filter((e) => e.type === "http").map((e) => e.source + "|" + e.target));

  ctx.font = "10px ui-monospace, monospace";
  list.forEach((n, i) => {
    const y = pad + i * cell;
    ctx.fillStyle = n.id === selected ? "#3fe0a0" : "#8b98ad";
    ctx.textAlign = "right";
    ctx.fillText(n.id.slice(0, 28), pad - 8, y + cell * 0.75);
    ctx.save();
    ctx.translate(pad + i * cell + cell * 0.8, pad - 8);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = "left";
    ctx.fillText(n.id.slice(0, 28), 0, 0);
    ctx.restore();
  });
  list.forEach((src, i) => list.forEach((dst, j) => {
    const key = src.id + "|" + dst.id;
    const x = pad + j * cell, y = pad + i * cell;
    if (edgeSet.has(key)) ctx.fillStyle = httpSet.has(key) ? "#f778ba" : "#3fe0a0";
    else if (src.id === selected || dst.id === selected) ctx.fillStyle = "#16241f";
    else ctx.fillStyle = (i + j) % 2 ? "#0e131b" : "#111722";
    ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
  }));
  if (nodes.filter(inFilter).length > MATRIX_CAP) {
    ctx.fillStyle = "#8b98ad"; ctx.textAlign = "left";
    ctx.fillText(`showing the ${MATRIX_CAP} most connected nodes`, 8, size - 8);
  }
  cv.onclick = (ev) => {
    const rect = cv.getBoundingClientRect();
    const i = Math.floor((ev.clientY - rect.top - pad) / cell);
    const j = Math.floor((ev.clientX - rect.left - pad) / cell);
    const pick = list[i >= 0 ? i : j];
    if (pick) selectNode(pick.id, false);
  };
}

// ---------------------------------------------------------------- treemap view
function squarify(items, x, y, w, h) {
  // Classic squarified treemap; items = [{value, ...}] sorted desc.
  const out = [];
  let row = [], rowSum = 0;
  const total = items.reduce((s, it) => s + it.value, 0) || 1;
  let area = w * h, rest = items.slice(), rx = x, ry = y, rw = w, rh = h;
  const scale = area / total;
  const worst = (row, len) => {
    if (!row.length) return Infinity;
    const s = row.reduce((a, b) => a + b.value, 0) * scale;
    const max = Math.max(...row.map((r) => r.value * scale));
    const min = Math.min(...row.map((r) => r.value * scale));
    return Math.max((len * len * max) / (s * s), (s * s) / (len * len * min));
  };
  while (rest.length) {
    const short = Math.min(rw, rh);
    const next = rest[0];
    if (!row.length || worst(row.concat(next), short) <= worst(row, short)) {
      row.push(rest.shift()); rowSum += next.value;
      if (rest.length) continue;
    }
    const s = row.reduce((a, b) => a + b.value, 0) * scale;
    const thick = short ? s / short : 0;
    let off = 0;
    row.forEach((it) => {
      const frac = (it.value * scale) / (s || 1);
      if (rw >= rh) out.push({ ...it, x: rx, y: ry + off, w: thick, h: rh * frac });
      else out.push({ ...it, x: rx + off, y: ry, w: rw * frac, h: thick });
      off += (rw >= rh ? rh : rw) * frac;
    });
    if (rw >= rh) { rx += thick; rw -= thick; } else { ry += thick; rh -= thick; }
    row = []; rowSum = 0;
  }
  return out;
}

function renderTreemap() {
  const host = el("tmRoot");
  const W = host.clientWidth || 800, H = host.clientHeight || 600;
  const groups = new Map();
  filesIndex.forEach((meta, path) => {
    const n = nodes.find((x) => fileOf(x) === path);
    if (fileFilter && !(path === fileFilter || path.startsWith(fileFilter + "/"))) return;
    const folder = dirOf(path);
    if (!groups.has(folder)) groups.set(folder, []);
    groups.get(folder).push({ path, value: Math.max(1, meta.lines || meta.nodes.length * 12),
                              lines: meta.lines, count: meta.nodes.length, sample: n });
  });
  const gitems = [...groups.entries()]
    .map(([folder, files]) => ({ folder, files, value: files.reduce((s, f) => s + f.value, 0) }))
    .sort((a, b) => b.value - a.value);
  const boxes = squarify(gitems, 0, 0, W, H);

  let html = "";
  boxes.forEach((g) => {
    html += `<div class="tmg" style="left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px">
      <b>${esc(g.folder)}</b></div>`;
    const inner = squarify(g.files.slice().sort((a, b) => b.value - a.value),
                           g.x + 4, g.y + 8, Math.max(0, g.w - 8), Math.max(0, g.h - 14));
    inner.forEach((f) => {
      const color = f.sample ? colorFor(f.sample) : "#30363d";
      const label = f.w > 54 && f.h > 22
        ? `${esc(baseOf(f.path))}<br />${f.lines ? f.lines + " lines" : f.count + " nodes"}` : "";
      html += `<div class="tmf" data-file="${esc(f.path)}" title="${esc(f.path)} — ${f.count} node(s)"
        style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px;background:${color}">${label}</div>`;
    });
  });
  host.innerHTML = html;
  host.querySelectorAll("[data-file]").forEach((d) =>
    d.addEventListener("click", () => { showFile(d.dataset.file); setFilter(d.dataset.file); }));
}

// ---------------------------------------------------------------- selection
function computeHighlight(id) {
  const isBlast = el("blast").checked;
  const down = isBlast ? reach(id, outAdj).set : new Set(outAdj.get(id) || []);
  const up = isBlast ? reach(id, inAdj).set : new Set(inAdj.get(id) || []);
  highlightNodes = new Set([id, ...down, ...up]);
  highlightLinks = new Set();
  links.forEach((l) => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    if (s === id || t === id) highlightLinks.add(l);
    else if (isBlast && highlightNodes.has(s) && highlightNodes.has(t)) highlightLinks.add(l);
  });
}

function selectNode(id, recenter) {
  const node = byId.get(id);
  if (!node) return;
  selected = id;
  computeHighlight(id);
  showTab("file");
  renderFile(node);
  if (recenter && node.x != null && view !== "matrix" && view !== "treemap") {
    Graph.centerAt(node.x, node.y, 500); Graph.zoom(3, 500);
  }
  if (view === "matrix") renderMatrix();
  updateStatus(); repaint();
}

function clearSelection() {
  selected = null; highlightNodes.clear(); highlightLinks.clear();
  // #backBtn is rendered into the panel by backLink(), so it only exists while a
  // panel that offers "back" is showing. Reset from any other panel used to throw
  // on null here; renderPanel() below redraws the panel from `backTo` anyway.
  backTo = null; el("backBtn")?.classList.remove("on");
  renderPanel(); updateStatus(); repaint();
  if (view === "matrix") renderMatrix();
}

function updateStatus() {
  const shown = nodes.filter(inFilter).length;
  el("stFiles").innerHTML = `<b>${filesIndex.size}</b> files`;
  el("stNodes").innerHTML = `<b>${shown}</b>${fileFilter ? "/" + nodes.length : ""} nodes`;
  el("stLinks").innerHTML = `<b>${links.length}</b> links`;
  const affected = selected ? reach(selected, inAdj).set.size : 0;
  el("stAffected").innerHTML = `<b>${affected}</b> affected`;
  el("stAffected").style.display = selected ? "" : "none";
  el("stSel").innerHTML = selected ? `selected <b>${esc(selected)}</b>` : "click a node for details";
}

// ---------------------------------------------------------------- right panel
const TABS = [["file", "File"], ["patterns", "Patterns"], ["security", "Security"]];
function renderTabs() {
  const counts = {
    patterns: (ANALYSIS.cycles || []).length + (ANALYSIS.layer_violations || []).length
      + (ANALYSIS.hubs || []).length + (ANALYSIS.god_objects || []).length
      + (ANALYSIS.orphans || []).length + (DUPES || []).length + (BLOCKS || []).length
      + Object.values(ANALYSIS.patterns || {}).reduce((s, v) => s + v.length, 0),
    security: FINDINGS.length,
  };
  el("tabs").innerHTML = TABS.map(([id, label]) =>
    `<button data-tab="${id}" class="${id === tab ? "on" : ""}">${label}
      ${counts[id] ? `<span class="badge ${id === "security" ? "high" : ""}">${counts[id]}</span>` : ""}
    </button>`).join("");
  el("tabs").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => showTab(b.dataset.tab)));
}
function showTab(next) { tab = next; renderTabs(); renderPanel(); }

function renderPanel() {
  if (tab === "patterns") return renderPatterns();
  if (tab === "security") return renderSecurity();
  if (selected) return renderFile(byId.get(selected));
  el("panel").innerHTML = backLink() +
    `<p class="empty">Select a node in the graph, a file in the explorer, or an entry in the
     Patterns / Security tabs.</p>`;
  wireBack();
}

const backLink = () => `<button id="backBtn" class="${backTo ? "on" : ""}">← Back to ${backTo || ""}</button>`;
function wireBack() {
  const b = el("backBtn");
  if (b) b.addEventListener("click", () => { const t = backTo; backTo = null; showTab(t === "Issues" ? "security" : "patterns"); });
  el("panel").querySelectorAll("[data-goto]").forEach((x) =>
    x.addEventListener("click", () => selectNode(x.dataset.goto, true)));
  el("panel").querySelectorAll("[data-file]").forEach((x) =>
    x.addEventListener("click", () => showFile(x.dataset.file)));
}

function severityOfImpact(pct) {
  if (pct >= 50) return ["crit", "CRITICAL"];
  if (pct >= 25) return ["high", "HIGH"];
  if (pct >= 10) return ["med", "MEDIUM"];
  return ["low", "LOW"];
}

function nodeItem(id) {
  const m = metrics(id), n = byId.get(id);
  const ln = n ? lineOf(n) : null;
  const int = outAdj.get(id) ? outAdj.get(id).length : 0;
  const ext = n && n.ext ? n.ext : 0;
  return `<div class="item" data-goto="${esc(id)}">
    <span class="mono link">${esc(id)}</span>
    <span class="grow">${ln ? `<span class="badge">L${ln}</span>` : ""}
      <span class="badge">${int} int</span>
      ${ext ? `<span class="badge med">${ext} ext</span>` : ""}</span></div>`;
}

function renderFile(node) {
  if (!node) return;
  const file = fileOf(node);
  const meta = filesIndex.get(file) || {};
  const up = reach(node.id, inAdj), down = reach(node.id, outAdj);
  const affected = up.set.size;
  const pct = nodes.length ? Math.round(100 * affected / nodes.length) : 0;
  const [sevCls, sevLabel] = severityOfImpact(pct);
  const m = metrics(node.id);
  const issues = issuesByNode.get(node.id) || [];
  const siblings = (meta.nodes || []).map((id) => byId.get(id))
    .sort((a, b) => (lineOf(a) || 0) - (lineOf(b) || 0));

  const parts = [backLink()];
  parts.push(`<h2 class="node mono">${esc(node.id)}</h2>
    <div class="sub">${esc(file)}${meta.lines ? ` · ${meta.lines} lines` : ""}
      ${lineOf(node) ? ` · line ${lineOf(node)}` : ""}</div>
    <div class="chips">
      <span class="chip"><i style="background:${colorFor(node)}"></i>${esc(node.kind || "node")}</span>
      ${node.layer ? `<span class="chip">${esc(node.layer)}</span>` : ""}
      ${node.cls ? `<span class="chip">${esc(node.cls)}</span>` : ""}
      ${node.lang ? `<span class="chip">${esc(node.lang)}</span>` : ""}
      ${(node.precision || []).map(r => `<span class="chip" title="${PRECISION_NOTES[r] || r}">${r}</span>`).join("")}
    </div>`);
  if (node.doc) parts.push(`<p class="doc">${renderDoc(node.doc)}</p>`);
  if (node.signature) parts.push(`<p class="doc mono" style="color:var(--muted)">${esc(node.signature)}</p>`);
  // One handler can serve several routes (Flask methods=[...], stacked decorators),
  // so this is a list -- showing only the first would hide half of what it answers.
  if (node.routes) parts.push(`<p class="doc">` + node.routes.map((r) =>
    `<span class="badge low">${esc(r.method)}</span> <code>${esc(r.path)}</code>`).join("<br>") + `</p>`);

  parts.push(`<details class="acc" open><summary>Blast radius
      <span class="grow badge ${sevCls}">${sevLabel}</span></summary>
    <div class="body">
      <div class="kv"><span>Impact</span><b>${affected} node(s) (${pct}%)</b></div>
      <div class="meter"><i style="width:${Math.min(100, pct)}%"></i></div>
      <div class="sub">Changes here propagate up to ${up.depth} level(s) of callers, and this node
        reaches ${down.set.size} node(s) downstream.</div>
      <div class="grp">Affected nodes</div>
      <div class="list">${[...up.set].slice(0, 12).map(nodeItem).join("") ||
        '<span class="empty">Nothing depends on this node.</span>'}</div>
      ${up.set.size > 12 ? `<div class="sub">+${up.set.size - 12} more</div>` : ""}
    </div></details>`);

  parts.push(`<details class="acc"><summary>Connections
      <span class="grow badge">${degree(node.id)}</span></summary>
    <div class="body">
      <div class="grp">${OUT_LABEL}</div>
      <div class="list">${(outAdj.get(node.id) || []).map(nodeItem).join("") || '<span class="empty">None</span>'}</div>
      <div class="grp">${IN_LABEL}</div>
      <div class="list">${(inAdj.get(node.id) || []).map(nodeItem).join("") || '<span class="empty">None</span>'}</div>
    </div></details>`);

  parts.push(`<details class="acc"><summary>Ownership
      <span class="grow badge">${m.commits != null ? m.commits + " commits" : "n/a"}</span></summary>
    <div class="body">${m.commits ? `
      <div class="kv"><span>Owner</span><b>${esc(m.owner || "unknown")}</b></div>
      <div class="kv"><span>Commits</span><b>${m.commits}</b></div>
      <div class="kv"><span>Risk (churn x links)</span><b>${m.risk}</b></div>
      <div class="kv"><span>Last change</span><b>${esc((m.last_commit || "").slice(0, 10) || "—")}</b></div>
      <div class="grp">Contributors${m.author_count > 3 ? ` (top 3 of ${m.author_count})` : ""}</div>
      ${Object.entries(m.authors || {}).map(([a, c]) =>
        `<div class="kv"><span>${esc(a)}</span><b>${c}</b></div>`).join("") || '<span class="empty">—</span>'}`
      : '<span class="empty">No git history for this file (run the report inside a git repo).</span>'}
    </div></details>`);

  parts.push(`<details class="acc" ${issues.length ? "open" : ""}><summary>Risk findings
      <span class="grow badge ${issues.length ? "high" : ""}">${issues.length}</span></summary>
    <div class="body">${issues.map(issueRow).join("") || '<span class="empty">None on this node.</span>'}</div>
    </details>`);

  parts.push(`<details class="acc"><summary>Functions in this file
      <span class="grow badge">${siblings.length}</span></summary>
    <div class="body"><div class="list">${siblings.map((s) => nodeItem(s.id)).join("")}</div></div>
    </details>`);

  el("panel").innerHTML = parts.join("");
  wireBack();
}

function showFile(path) {
  const meta = filesIndex.get(path);
  const first = meta && meta.nodes.length ? meta.nodes[0] : null;
  if (first) return selectNode(first, true);
  // File with no nodes (e.g. a module-level finding): show what we know.
  showTab("file");
  el("panel").innerHTML = backLink() + `<h2 class="node mono">${esc(baseOf(path))}</h2>
    <div class="sub">${esc(path)}</div>
    <div class="body">${(issuesByFile.get(path) || []).map(issueRow).join("") ||
      '<span class="empty">No nodes or findings recorded for this file.</span>'}</div>`;
  wireBack();
}

function renderDoc(text) {
  return esc(text || "").replace(/\[\[(.*?)\]\]/g, (_, id) =>
    byId.has(id) ? `<span class="link" data-goto="${esc(id)}">${esc(id)}</span>` : esc(id));
}

function issueRow(f) {
  return `<div class="issue ${SEV_CLASS[f.severity]}" ${f.node ? `data-goto="${esc(f.node)}"` : `data-file="${esc(f.file)}"`}>
    <span class="badge ${SEV_CLASS[f.severity]}">${esc(f.severity)}</span> ${esc(f.message)}
    <div class="m mono">${esc(f.file)}:${f.line}${f.node ? ` · ${esc(f.node)}` : ""}</div>
    <div class="m mono">${esc(f.snippet || "")}</div></div>`;
}

function renderSecurity() {
  const bySev = { high: [], medium: [], low: [] };
  FINDINGS.forEach((f) => bySev[f.severity].push(f));
  const body = Object.entries(bySev).filter(([, v]) => v.length).map(([sev, list]) =>
    `<div class="grp">${sev} — ${list.length}</div>${list.map(issueRow).join("")}`).join("");
  el("panel").innerHTML = `<h2 class="node">Security &amp; risk</h2>
    <div class="sub">${FINDINGS.length} finding(s) from the deterministic scan
      ${REPORT.security ? `· ${REPORT.security.summary.files_scanned} file(s) scanned` : ""}</div>
    ${body || '<p class="empty">No findings — or no report embedded in this page.</p>'}`;
  el("panel").querySelectorAll("[data-goto]").forEach((x) => x.addEventListener("click", () => {
    backTo = "Issues"; selectNode(x.dataset.goto, true);
  }));
  el("panel").querySelectorAll("[data-file]").forEach((x) => x.addEventListener("click", () => {
    backTo = "Issues"; showFile(x.dataset.file);
  }));
}

function renderPatterns() {
  const sections = [];
  const idioms = ANALYSIS.patterns || {};
  const push = (title, items, render) => {
    if (!items || !items.length) return;
    sections.push(`<div class="grp">${title} — ${items.length}</div>` + items.map(render).join(""));
  };
  push("Circular dependencies", ANALYSIS.cycles || [], (c) =>
    `<div class="item" data-goto="${esc(c[0])}"><span class="mono link">${c.map(esc).join(" → ")}</span></div>`);
  push("Backwards layer dependencies", ANALYSIS.layer_violations || [], (v) =>
    `<div class="item" data-goto="${esc(v.source)}"><span class="mono link">${esc(v.source)} → ${esc(v.target)}</span>
      <span class="grow"><span class="badge med">${esc(v.from)}→${esc(v.to)}</span></span></div>`);
  push("High coupling (hubs)", ANALYSIS.hubs || [], (h) =>
    `<div class="item" data-goto="${esc(h.node)}"><span class="mono link">${esc(h.node)}</span>
      <span class="grow"><span class="badge">${h.fan_in} in</span><span class="badge">${h.fan_out} out</span></span></div>`);
  push("God objects", ANALYSIS.god_objects || [], (g) =>
    `<div class="item"><span class="mono">${esc(g.name)}</span>
      <span class="grow"><span class="badge med">${g.count} ${esc(g.reason)}</span></span></div>`);
  push("Dead / unused nodes", ANALYSIS.orphans || [], (o) => nodeItem(o));
  push("Duplicate code", DUPES || [], (c) =>
    `<div class="item"><span class="grow">${c.nodes.map((id) => nodeItem(id)).join("")}</span>
      <span class="badge med">${c.tokens} tokens x${c.nodes.length}</span></div>`);
  // Phase 9: a block copied into two otherwise different nodes -- never a pair above.
  push("Copied blocks", BLOCKS || [], (b) =>
    `<div class="item"><span class="grow">${b.nodes.map((n) => nodeItem(n.id)).join("")}</span>
      <span class="badge med">${b.tokens} tokens, ${b.loc} lines</span></div>`);
  Object.entries(idioms).forEach(([name, ids]) =>
    push(name.replace(/_/g, " "), ids, (id) => nodeItem(id)));

  el("panel").innerHTML = `<h2 class="node">Patterns &amp; smells</h2>
    <div class="sub">Deterministic graph checks${HEALTH ? ` · grade ${HEALTH.grade} (${HEALTH.score}/100)` : ""}</div>
    ${sections.join("") || '<p class="empty">Nothing flagged — or no report embedded in this page.</p>'}`;
  el("panel").querySelectorAll("[data-goto]").forEach((x) => x.addEventListener("click", () => {
    backTo = "Patterns"; selectNode(x.dataset.goto, true);
  }));
}


// ---------------------------------------------------------------- controls
// Fold a section from its header. The rail cannot scroll, so folding is how you give the
// explorer room; state is per session and survives a map switch (the markup is not re-rendered).
document.querySelectorAll("#left .sect > h3").forEach((h) =>
  h.addEventListener("click", () => h.parentElement.classList.toggle("folded")));

// ---------------------------------------------------------------- panes
// Rail widths live in --lw / --rw on #app, set inline by a drag. Nothing re-renders #app, so
// a dragged width survives a map switch the same way a folded section does.
const app = el("app");
const RAIL = { rszL: { side: "left", v: "--lw", min: 200, max: 560 },
               rszR: { side: "right", v: "--rw", min: 260, max: 720 } };

// A rail may not eat the toolbar. Summing the children gives what it needs whatever the
// current width is - clientWidth would say "exactly what it already has" and let a drag
// ratchet controls off the right edge one pixel at a time.
const toolbar = document.querySelector(".toolbar");
// The toggles do not count: below the full row they move into the overflow menu, so
// the cap is what the *compact* row needs, and a rail can widen into their space.
const stageMin = () =>
  Math.max(360, [...toolbar.children].reduce((w, c) => w + (c.id === "toggles" ? 0 : c.offsetWidth), 0));
function setRail(cfg, px) {
  const other = el(cfg.side === "left" ? "right" : "left").getBoundingClientRect().width;
  const max = Math.min(cfg.max, document.documentElement.clientWidth - other - stageMin());
  app.style.setProperty(cfg.v, Math.round(Math.max(cfg.min, Math.min(max, px))) + "px");
}

Object.entries(RAIL).forEach(([id, cfg]) => {
  el(id).addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const grip = el(id);
    grip.setPointerCapture(e.pointerId);
    grip.classList.add("drag");
    const move = (ev) => setRail(cfg, cfg.side === "left"
      ? ev.clientX : document.documentElement.clientWidth - ev.clientX);
    const up = () => {
      grip.classList.remove("drag");
      grip.removeEventListener("pointermove", move);
      grip.removeEventListener("pointerup", up);
    };
    grip.addEventListener("pointermove", move);
    grip.addEventListener("pointerup", up);
  });
});

el("zoomIn").addEventListener("click", () => Graph.zoom(Graph.zoom() * 1.4, 250));
el("zoomOut").addEventListener("click", () => Graph.zoom(Graph.zoom() / 1.4, 250));
el("zoomFit").addEventListener("click", () => Graph.zoomToFit(400, 60));
el("reset").addEventListener("click", () => { setFilter(null); clearSelection(); resetLayout(); });
el("hulls").addEventListener("change", repaint);
el("showTests").addEventListener("change", () => applyMap(mapName));
el("blast").addEventListener("change", () => {
  if (selected) { computeHighlight(selected); repaint(); }
});
// The overflow menu. Its buttons keep their old ids, so the handlers around this
// did not change; the menu only decides where they are drawn.
const moreMenu = el("moreMenu");
const setMore = (open) => {
  moreMenu.hidden = !open;
  el("moreBtn").classList.toggle("on", open);
  el("moreBtn").setAttribute("aria-expanded", String(open));
};
el("moreBtn").addEventListener("click", (e) => { e.stopPropagation(); setMore(moreMenu.hidden); });
moreMenu.addEventListener("click", (e) => { if (!e.target.closest("label")) setMore(false); });
document.addEventListener("click", (e) => { if (!el("more").contains(e.target)) setMore(false); });
window.addEventListener("keydown", (e) => { if (e.key === "Escape") setMore(false); });

// Compact toolbar. FULL_NEED is measured while the toggles are in the row, and the row
// goes compact only when the toolbar is narrower than that -- so it never clips, and it
// comes back out as soon as there is room. Re-parenting moves the same label elements,
// so their ids, checked state and handlers go with them.
let FULL_NEED = 0;
function fitToolbar() {
  const home = el("toggles"), slot = el("menuToggles");
  const compact = toolbar.classList.contains("compact");
  if (!compact) FULL_NEED = [...toolbar.children].reduce((w, c) => w + c.offsetWidth, 0);
  const want = toolbar.clientWidth > 0 && toolbar.clientWidth < FULL_NEED;
  if (want === compact) return;
  toolbar.classList.toggle("compact", want);
  const [from, to] = want ? [home, slot] : [slot, home];
  to.append(...from.children);
}
new ResizeObserver(fitToolbar).observe(toolbar);

el("png").addEventListener("click", () => {
  const canvas = el("graph").querySelector("canvas") || el("matrix");
  const a = document.createElement("a");
  a.download = (document.title || "graph").replace(/\W+/g, "_") + ".png";
  a.href = canvas.toDataURL("image/png");
  a.click();
});

const search = el("search");
search.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const term = search.value.trim().toLowerCase();
  const hit = nodes.find((n) => n.id.toLowerCase().includes(term));
  if (hit) selectNode(hit.id, true);
});
window.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== search) { e.preventDefault(); search.focus(); }
  else if (e.key === "Escape") { clearSelection(); search.blur(); }
});

const stage = el("stage");
const fit = () => {
  Graph.width(stage.clientWidth).height(stage.clientHeight);
  if (view === "matrix") renderMatrix();
  if (view === "treemap") renderTreemap();
};
new ResizeObserver(fit).observe(stage);

// ---------------------------------------------------------------- map switch
function renderMapSwitch() {
  el("mapSwitch").style.display = MAP_NAMES.length > 1 ? "flex" : "none";
  el("mapSwitch").innerHTML = MAP_NAMES.map((name) =>
    `<button data-map="${name}" class="${name === mapName ? "on" : ""}">${esc(MAPS[name].label)}
      <span class="badge">${MAPS[name].graph.nodes.length}</span></button>`).join("");
  el("mapSwitch").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { if (b.dataset.map !== mapName) applyMap(b.dataset.map); }));
  el("mapSub").textContent = MAPS[mapName].title;
  el("mapSub").title = MAPS[mapName].title;
  el("mapGrade").innerHTML = HEALTH
    ? `grade <b>${HEALTH.grade}</b> (${HEALTH.score}/100)` : "no report embedded";
}

// Switch the whole page over to another map: same UI, different graph.
function applyMap(name) {
  loadMap(name);
  selected = null; fileFilter = null; backTo = null; tab = "file";
  highlightNodes = new Set(); highlightLinks = new Set();
  el("filterChip").classList.remove("on");
  if (!HAS_CHURN && (colorMode === "churn" || colorMode === "risk")) colorMode = "layer";
  // `.toolbar label { display: inline-flex }` outranks the UA rule for [hidden],
  // so the attribute alone would leave the control on screen.
  el("testsToggle").style.display = HAS_TESTS ? "" : "none";
  renderMapSwitch(); renderHealth(); renderColorModes(); renderLegend(); renderTiles();
  renderTree(); renderTabs(); renderPanel(); updateStatus();
  Graph.graphData({ nodes, links });
  setView(view);
}

try {
  applyMap(mapName);
  fit();
  setTimeout(() => Graph.zoomToFit(600, 60), 600);
} catch (err) {
  // A generated page that fails silently is a blank screen; say what broke.
  el("panel").innerHTML = `<p class="empty">The explorer failed to start: ${esc(String(err))}</p>`;
  throw err;
}
</script>
</body>
</html>
