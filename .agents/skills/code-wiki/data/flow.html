<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Code Archaeologist — Request Flow</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #c9d1d9;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 8px 12px;
    background: rgba(13,17,23,.85); border-bottom: 1px solid #21262d; display: flex;
    gap: 8px; align-items: center; flex-wrap: wrap; }
  #bar input { background: #161b22; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 6px; padding: 6px 10px; width: 260px; outline: none; }
  #bar .hint { color: #8b949e; font-size: 12px; }
  #legend { display: flex; gap: 10px; font-size: 12px; margin-left: auto; }
  #legend span { display: inline-flex; align-items: center; gap: 4px; }
  #legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #graph { position: fixed; inset: 0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/force-graph@1.43.5/dist/force-graph.min.js"></script>
</head>
<body>
<div id="bar">
  <strong>Code Archaeologist — Request Flow</strong>
  <input id="q" placeholder="search node… (Enter to focus)" autocomplete="off" />
  <span class="hint" id="stats"></span>
  <span id="legend"></span>
</div>
<div id="graph"></div>
<script>
// ---- Embedded graph data (edit freely, or regenerate with build_html.py) ----
const GRAPH = {
  "nodes": [
    {
      "id": "OrderController.__init__",
      "layer": "controller",
      "kind": "endpoint",
      "cls": "OrderController",
      "signature": "__init__(self, service: OrderService)",
      "doc": "_No description available._",
      "source": "order_controller.py:8"
    },
    {
      "id": "OrderController.create_order",
      "layer": "controller",
      "kind": "endpoint",
      "cls": "OrderController",
      "signature": "create_order(self, payload)",
      "doc": "POST /orders \u2014 create a new order.",
      "source": "order_controller.py:11"
    },
    {
      "id": "OrderController.get_order",
      "layer": "controller",
      "kind": "endpoint",
      "cls": "OrderController",
      "signature": "get_order(self, order_id)",
      "doc": "GET /orders/{id} \u2014 fetch a single order.",
      "source": "order_controller.py:15"
    },
    {
      "id": "OrderRepository.get",
      "layer": "repository",
      "kind": "method",
      "cls": "OrderRepository",
      "signature": "get(self, order_id)",
      "doc": "Select an order by id.",
      "source": "order_repository.py:11"
    },
    {
      "id": "OrderRepository.save",
      "layer": "repository",
      "kind": "method",
      "cls": "OrderRepository",
      "signature": "save(self, order)",
      "doc": "Insert a new order row.",
      "source": "order_repository.py:7"
    },
    {
      "id": "OrderService.__init__",
      "layer": "service",
      "kind": "method",
      "cls": "OrderService",
      "signature": "__init__(self, repository: OrderRepository, payments: PaymentClient)",
      "doc": "_No description available._",
      "source": "order_service.py:9"
    },
    {
      "id": "OrderService.find_order",
      "layer": "service",
      "kind": "method",
      "cls": "OrderService",
      "signature": "find_order(self, order_id)",
      "doc": "Look up an order by id.",
      "source": "order_service.py:18"
    },
    {
      "id": "OrderService.place_order",
      "layer": "service",
      "kind": "method",
      "cls": "OrderService",
      "signature": "place_order(self, payload)",
      "doc": "Charge payment then persist the order.",
      "source": "order_service.py:13"
    },
    {
      "id": "PaymentClient.charge",
      "layer": "client",
      "kind": "method",
      "cls": "PaymentClient",
      "signature": "charge(self, payload)",
      "doc": "Charge the customer for an order.",
      "source": "payment_client.py:7"
    }
  ],
  "edges": [
    {
      "source": "OrderController.create_order",
      "target": "OrderService.place_order",
      "type": "calls"
    },
    {
      "source": "OrderController.get_order",
      "target": "OrderService.find_order",
      "type": "calls"
    },
    {
      "source": "OrderService.find_order",
      "target": "OrderRepository.get",
      "type": "calls"
    },
    {
      "source": "OrderService.place_order",
      "target": "OrderRepository.save",
      "type": "calls"
    },
    {
      "source": "OrderService.place_order",
      "target": "PaymentClient.charge",
      "type": "calls"
    }
  ]
};

// ---- Customize colors per architectural layer here ----
const LAYER_COLORS = {
  controller: "#f778ba", service: "#58a6ff", repository: "#3fb950",
  model: "#d29922", config: "#a371f7", client: "#39c5cf", unknown: "#8b949e"
};
let HL = null;

document.getElementById("stats").textContent =
  GRAPH.nodes.length + " nodes · " + GRAPH.edges.length + " edges";

// Build legend from layers actually present.
const legend = document.getElementById("legend");
[...new Set(GRAPH.nodes.map(n => n.layer))].forEach(layer => {
  const s = document.createElement("span");
  s.innerHTML = '<i style="background:' + (LAYER_COLORS[layer] || LAYER_COLORS.unknown) + '"></i>' + layer;
  legend.appendChild(s);
});

const links = GRAPH.edges.map(e => ({ source: e.source, target: e.target, type: e.type }));
const Graph = ForceGraph()(document.getElementById("graph"))
  .backgroundColor("#0d1117")
  .graphData({ nodes: GRAPH.nodes.map(n => ({ ...n })), links })
  .nodeId("id")
  .nodeRelSize(5)
  .linkColor(() => "rgba(139,148,158,.35)")
  .linkDirectionalArrowLength(4)
  .linkDirectionalArrowRelPos(1)
  .nodeCanvasObject((node, ctx, scale) => {
    const r = 5;
    ctx.beginPath();
    ctx.arc(node.x, node.y, r, 0, 2 * Math.PI);
    ctx.fillStyle = (HL && HL === node.id) ? "#ffffff"
      : (LAYER_COLORS[node.layer] || LAYER_COLORS.unknown);
    ctx.fill();
    const fontSize = Math.max(3, 12 / scale);
    ctx.font = fontSize + "px monospace";
    ctx.fillStyle = "#c9d1d9";
    ctx.fillText(node.id, node.x + r + 1, node.y + 3);
  })
  .onNodeClick(node => {
    Graph.centerAt(node.x, node.y, 500);
    Graph.zoom(4, 500);
    HL = node.id;
  });

function focus(term) {
  term = (term || "").trim().toLowerCase();
  if (!term) { HL = null; return; }
  const hit = Graph.graphData().nodes.find(n => n.id.toLowerCase().includes(term));
  if (hit) { HL = hit.id; Graph.centerAt(hit.x, hit.y, 500); Graph.zoom(4, 500); }
}
const q = document.getElementById("q");
q.addEventListener("keydown", e => { if (e.key === "Enter") focus(q.value); });
q.addEventListener("input", () => { if (!q.value) HL = null; });
</script>
</body>
</html>
