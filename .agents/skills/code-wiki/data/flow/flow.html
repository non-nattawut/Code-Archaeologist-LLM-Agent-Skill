<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Code Archaeologist — Request Flow</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11161f; --panel2: #0e131b; --border: #222b39;
    --text: #d7dde8; --muted: #8b98ad; --accent: #3fe0a0; --link: #6ea8fe;
    --danger: #f85149; --warn: #e3b341; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #202a38; border-radius: 6px; }

  #app { display: grid; grid-template-columns: 300px 1fr 380px; height: 100%; }
  aside { background: var(--panel); overflow-y: auto; }
  #left { border-right: 1px solid var(--border); }
  #right { border-left: 1px solid var(--border); }
  #center { display: flex; flex-direction: column; min-width: 0; }

  /* ---- left ---- */
  .brand { display: flex; align-items: center; gap: 9px; padding: 14px 16px;
    border-bottom: 1px solid var(--border); }
  .brand .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--accent);
    display: grid; place-items: center; color: #06231a; font-weight: 800; font-size: 13px; }
  .brand b { letter-spacing: .6px; font-size: 13px; }
  .brand span { color: var(--muted); font-size: 11px; }

  .health { display: flex; align-items: center; gap: 14px; padding: 16px;
    border-bottom: 1px solid var(--border); }
  .health .score { font-size: 22px; font-weight: 700; line-height: 1; }
  .health .label { color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .8px; margin-top: 4px; }
  .health .why { color: var(--muted); font-size: 11px; margin-top: 6px; }

  .sect { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sect > h3 { margin: 0 0 10px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); font-weight: 600; }
  .modes { display: flex; flex-direction: column; gap: 4px; }
  .modes button { display: flex; align-items: center; gap: 9px; padding: 9px 11px;
    border-radius: 8px; border: 1px solid transparent; text-align: left; }
  .modes button:hover { background: #161d28; }
  .modes button.on { background: #16241f; border-color: #24513f; color: #a9f5d0; }
  .modes button[disabled] { opacity: .35; cursor: not-allowed; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; text-align: center; }
  .tile b { display: block; font-size: 19px; color: var(--accent); }
  .tile.alt b { color: var(--warn); }
  .tile span { font-size: 10px; letter-spacing: .8px; color: var(--muted); text-transform: uppercase; }

  .loc { text-align: center; }
  .loc b { display: block; font-size: 21px; color: var(--link); }
  .bar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; margin: 10px 0 8px; }
  .bar i { display: block; height: 100%; }
  .langs { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); }
  .langs span { display: inline-flex; align-items: center; gap: 5px; }
  .langs i { width: 8px; height: 8px; border-radius: 2px; }

  #filterChip { display: none; align-items: center; gap: 8px; width: 100%; margin-bottom: 8px;
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); }
  #filterChip.on { display: flex; }
  #search { width: 100%; background: var(--panel2); color: var(--text); font-size: 12px;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; outline: none; }
  #search:focus { border-color: var(--accent); }
  .tree { margin-top: 10px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 6px;
    cursor: pointer; white-space: nowrap; }
  .row:hover { background: #161d28; }
  .row.on { background: #16241f; color: #a9f5d0; }
  .row .name { overflow: hidden; text-overflow: ellipsis; }
  .row .n { margin-left: auto; color: var(--muted); font-size: 10px; }
  .row .tw { width: 10px; color: var(--muted); font-size: 9px; }

  /* ---- center ---- */
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  .tbtn { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
    background: var(--panel2); font-size: 12px; }
  .tbtn:hover { border-color: #33415a; }
  .tbtn.on { background: #16241f; border-color: #24513f; color: #a9f5d0; }
  .views { display: flex; gap: 4px; margin: 0 auto; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .views button { padding: 6px 12px; border-radius: 7px; font-size: 12px; color: var(--muted); }
  .views button.on { background: #16241f; color: #a9f5d0; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--muted); cursor: pointer; }

  #stage { position: relative; flex: 1; min-height: 0; }
  #graph, #matrix, #treemap { position: absolute; inset: 0; }
  #matrix, #treemap { display: none; overflow: auto; background: var(--bg); }
  #treemap { padding: 14px; }
  .tm { position: relative; width: 100%; height: 100%; }
  .tmf { position: absolute; border: 1px solid rgba(0,0,0,.45); border-radius: 4px;
    overflow: hidden; cursor: pointer; padding: 4px 6px; font-size: 10px; line-height: 1.25;
    color: #06121a; }
  .tmf:hover { outline: 2px solid #fff; }
  .tmg { position: absolute; border: 1px solid var(--border); border-radius: 6px; }
  .tmg > b { position: absolute; top: -9px; left: 8px; background: var(--bg); padding: 0 6px;
    font-size: 10px; color: var(--muted); font-weight: 500; }

  .status { display: flex; gap: 8px; align-items: center; padding: 8px 12px;
    border-top: 1px solid var(--border); background: var(--panel); font-size: 11px; }
  .pill { border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
    background: var(--panel2); color: var(--muted); }
  .pill b { color: var(--text); }
  .pill.hot { border-color: #5b2222; color: #ff9d94; }

  /* ---- right ---- */
  .tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: var(--panel); z-index: 5; }
  .tabs button { flex: 1; padding: 12px 8px; font-size: 11px; letter-spacing: .8px;
    text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .badge { margin-left: 6px; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 7px; font-size: 10px;
    background: #1b2431; color: var(--muted); }
  .badge.crit { background: #3a1113; color: #ff9d94; }
  .badge.high { background: #3a1113; color: #ff9d94; }
  .badge.med { background: #3a2f10; color: #f2cc60; }
  .badge.low { background: #12283a; color: #79c0ff; }
  .pad { padding: 16px; }
  #backBtn { display: none; width: 100%; margin-bottom: 14px; padding: 9px 11px; text-align: left;
    border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 12px; }
  #backBtn.on { display: block; }
  h2.node { margin: 0 0 4px; font-size: 15px; word-break: break-all; }
  .sub { color: var(--muted); font-size: 11px; word-break: break-all; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
    display: inline-flex; align-items: center; gap: 5px; text-transform: capitalize; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; }

  .acc { border: 1px solid var(--border); border-radius: 10px; margin-top: 12px;
    background: var(--panel2); }
  .acc > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex;
    align-items: center; gap: 8px; font-size: 12px; }
  .acc > summary::-webkit-details-marker { display: none; }
  .acc > summary::before { content: "▶"; font-size: 8px; color: var(--muted); transition: .15s; }
  .acc[open] > summary::before { transform: rotate(90deg); }
  .acc > summary .grow { margin-left: auto; }
  .acc .body { padding: 0 14px 14px; }
  .meter { height: 6px; border-radius: 4px; background: #1b2431; overflow: hidden; margin: 6px 0; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg,#e3b341,#f85149); }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0;
    font-size: 12px; border-bottom: 1px dashed #1b2431; }
  .kv:last-child { border-bottom: none; }
  .kv span { color: var(--muted); }
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px;
    border-bottom: 1px dashed #1b2431; cursor: pointer; }
  .item:last-child { border-bottom: none; }
  .item:hover .mono { color: var(--accent); }
  .item .grow { margin-left: auto; display: flex; gap: 5px; }
  .mono, code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .link { color: var(--link); cursor: pointer; }
  .link:hover { text-decoration: underline; }
  .empty { color: var(--muted); font-style: italic; font-size: 12px; }
  .doc { font-size: 13px; line-height: 1.55; margin: 10px 0 0; }
  .issue { border-left: 2px solid var(--danger); padding: 2px 0 2px 9px; margin: 8px 0;
    font-size: 12px; cursor: pointer; }
  .issue.med { border-color: var(--warn); }
  .issue.low { border-color: var(--link); }
  .issue .m { color: var(--muted); font-size: 11px; }
  .grp { margin: 16px 0 6px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); }

  @media (max-width: 1180px) {
    #app { grid-template-columns: 240px 1fr 320px; }
  }
</style>

<div id="app">
  <aside id="left">
    <div class="brand"><span class="dot">C</span><div><b>CODE ARCHAEOLOGIST</b><br /><span id="mapName"></span></div></div>

    <div class="health">
      <svg width="62" height="62" viewBox="0 0 62 62" id="ring"></svg>
      <div>
        <div class="score" id="healthScore">—</div>
        <div class="label">Health score</div>
        <div class="why" id="healthWhy"></div>
      </div>
    </div>

    <div class="sect">
      <h3>Color by</h3>
      <div class="modes" id="colorModes"></div>
      <div class="langs" id="legend" style="margin-top:10px"></div>
    </div>

    <div class="sect">
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="sect loc" id="locBox"></div>

    <div class="sect">
      <h3>Explorer</h3>
      <button id="filterChip"><b>×</b> <span id="filterName"></span></button>
      <input id="search" placeholder="Search node…  (press /)" autocomplete="off" />
      <div class="tree" id="tree"></div>
    </div>
  </aside>

  <main id="center">
    <div class="toolbar">
      <button class="tbtn" id="zoomIn" title="Zoom in">+</button>
      <button class="tbtn" id="zoomOut" title="Zoom out">−</button>
      <button class="tbtn" id="zoomFit" title="Fit to screen">⤢</button>
      <button class="tbtn" id="reset" title="Reset selection & filter">⟲</button>
      <div class="views" id="views"></div>
      <label><input type="checkbox" id="hulls" checked /> Folders</label>
      <label><input type="checkbox" id="blast" /> Blast radius</label>
      <button class="tbtn" id="png" title="Export the current graph as PNG">⤓ PNG</button>
    </div>
    <div id="stage">
      <div id="graph"></div>
      <canvas id="matrix"></canvas>
      <div id="treemap"><div class="tm" id="tmRoot"></div></div>
    </div>
    <div class="status">
      <span class="pill" id="stFiles"></span>
      <span class="pill" id="stNodes"></span>
      <span class="pill" id="stLinks"></span>
      <span class="pill hot" id="stAffected"></span>
      <span class="pill" id="stSel" style="margin-left:auto"></span>
    </div>
  </main>

  <aside id="right">
    <div class="tabs" id="tabs"></div>
    <div class="pad" id="panel"></div>
  </aside>
</div>

// Convex hull (monotone chain) per folder, drawn behind the nodes.
function hull(points) {
  if (points.length < 3) return points;
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const half = (src) => {
    const out = [];
    for (const pt of src) {
      while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], pt) <= 0) out.pop();
      out.push(pt);
    }
    out.pop();
    return out;
  };
  return half(p).concat(half(p.slice().reverse()));
}

function drawHulls(ctx, scale) {
  // Only the free layouts group by position; in dag/radial views hulls just overlap.
  if (!el("hulls").checked || !(view === "graph" || view === "cluster")) return;
  const groups = new Map();
  nodes.forEach((n) => {
    if (n.x == null || !inFilter(n)) return;
    const f = dirOf(fileOf(n));
    if (!groups.has(f)) groups.set(f, []);
    groups.get(f).push([n.x, n.y]);
  });
  groups.forEach((pts, folder) => {
    if (pts.length < 2) return;
    const color = folderColor(folder);
    const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
    const cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    const pad = 24;
    // Push each hull vertex outward, then round the corners by curving through
    // the edge midpoints — a padded polygon reads as spikes, this reads as a blob.
    const ring = hull(pts).map(([x, y]) => {
      const dx = x - cx, dy = y - cy, len = Math.hypot(dx, dy) || 1;
      return [x + (dx / len) * pad, y + (dy / len) * pad];
    });
    if (ring.length < 3) return;
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    ctx.beginPath();
    let prev = ring[ring.length - 1];
    ctx.moveTo(...mid(prev, ring[0]));
    ring.forEach((pt, i) => {
      const next = ring[(i + 1) % ring.length];
      const m = mid(pt, next);
      ctx.quadraticCurveTo(pt[0], pt[1], m[0], m[1]);
    });
    ctx.closePath();
    ctx.fillStyle = color + "12";
    ctx.strokeStyle = color + "44";
    ctx.lineWidth = 1 / scale;
    ctx.fill(); ctx.stroke();

    const top = Math.min(...ring.map((p) => p[1]));
    ctx.fillStyle = color + "cc";
    ctx.font = `${Math.max(3, 11 / scale)}px ui-monospace, monospace`;
    ctx.textAlign = "center";
    ctx.fillText(folder, cx, top - 6 / scale);
    ctx.textAlign = "left";
  });
}

// Bundle: nodes pinned on a circle, grouped by folder, links drawn as curves that
// bow through the middle — the readable stand-in for hierarchical edge bundling.
function layoutBundle() {
  const ordered = nodes.slice().sort((a, b) => {
    const fa = dirOf(fileOf(a)), fb = dirOf(fileOf(b));
    return fa.localeCompare(fb) || a.id.localeCompare(b.id);
  });
  const R = 40 + ordered.length * 9;
  ordered.forEach((n, i) => {
    const a = (i / ordered.length) * 2 * Math.PI;
    n.fx = Math.cos(a) * R; n.fy = Math.sin(a) * R;
  });
}

// Cluster: folders get anchors on a ring, and each folder's nodes sit on a small
// circle around their anchor. Pinned, so the grouping is stable and readable.
function layoutCluster() {
  const groups = new Map(folders.map((f) => [f, []]));
  nodes.forEach((n) => groups.get(dirOf(fileOf(n)))?.push(n));
  const R = 160 + folders.length * 60;
  [...groups.entries()].forEach(([folder, members], gi) => {
    const a = (gi / Math.max(1, folders.length)) * 2 * Math.PI;
    const [cx, cy] = folders.length === 1 ? [0, 0] : [Math.cos(a) * R, Math.sin(a) * R];
    const r = 30 + members.length * 11;
    members.forEach((n, i) => {
      const t = (i / Math.max(1, members.length)) * 2 * Math.PI;
      n.fx = cx + Math.cos(t) * r;
      n.fy = cy + Math.sin(t) * r;
    });
  });
}

    ctx.textAlign = "right";

    ctx.rotate(-Math.PI / 2);

    ctx.fillText(n.id.slice(0, 28), 0, 0);
    ctx.restore();
  });
  list.forEach((src, i) => list.forEach((dst, j) => {
    const key = src.id + "|" + dst.id;
    const x = pad + j * cell, y = pad + i * cell;
    if (edgeSet.has(key)) ctx.fillStyle = httpSet.has(key) ? "#f778ba" : "#3fe0a0";
    else if (src.id === selected || dst.id === selected) ctx.fillStyle = "#16241f";

    const j = Math.floor((ev.clientX - rect.left - pad) / cell);
    const pick = list[i >= 0 ? i : j];
    if (pick) selectNode(pick.id, false);
  };
}

// ---------------------------------------------------------------- treemap view
function squarify(items, x, y, w, h) {
  // Classic squarified treemap; items = [{value, ...}] sorted desc.
  const out = [];
  let row = [], rowSum = 0;
  const total = items.reduce((s, it) => s + it.value, 0) || 1;
  let area = w * h, rest = items.slice(), rx = x, ry = y, rw = w, rh = h;
  const scale = area / total;
  const worst = (row, len) => {
    if (!row.length) return Infinity;
    const s = row.reduce((a, b) => a + b.value, 0) * scale;
    const max = Math.max(...row.map((r) => r.value * scale));
    const min = Math.min(...row.map((r) => r.value * scale));
    return Math.max((len * len * max) / (s * s), (s * s) / (len * len * min));
  };
  while (rest.length) {
    const short = Math.min(rw, rh);
    const next = rest[0];
    if (!row.length || worst(row.concat(next), short) <= worst(row, short)) {
      row.push(rest.shift()); rowSum += next.value;
      if (rest.length) continue;
    }
    const s = row.reduce((a, b) => a + b.value, 0) * scale;
    const thick = short ? s / short : 0;
    let off = 0;
    row.forEach((it) => {
      const frac = (it.value * scale) / (s || 1);
      if (rw >= rh) out.push({ ...it, x: rx, y: ry + off, w: thick, h: rh * frac });
      else out.push({ ...it, x: rx + off, y: ry, w: rw * frac, h: thick });
      off += (rw >= rh ? rh : rw) * frac;
    });
    if (rw >= rh) { rx += thick; rw -= thick; } else { ry += thick; rh -= thick; }
    row = []; rowSum = 0;
  }
  return out;
}

function renderTreemap() {
  const host = el("tmRoot");
  const W = host.clientWidth || 800, H = host.clientHeight || 600;
  const groups = new Map();
  filesIndex.forEach((meta, path) => {
    const n = nodes.find((x) => fileOf(x) === path);
    if (fileFilter && !(path === fileFilter || path.startsWith(fileFilter + "/"))) return;
    const folder = dirOf(path);
    if (!groups.has(folder)) groups.set(folder, []);
    groups.get(folder).push({ path, value: Math.max(1, meta.lines || meta.nodes.length * 12),
                              lines: meta.lines, count: meta.nodes.length, sample: n });
  });
  const gitems = [...groups.entries()]
    .map(([folder, files]) => ({ folder, files, value: files.reduce((s, f) => s + f.value, 0) }))
    .sort((a, b) => b.value - a.value);
  const boxes = squarify(gitems, 0, 0, W, H);

  let html = "";
  boxes.forEach((g) => {
    html += `<div class="tmg" style="left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px">
      <b>${esc(g.folder)}</b></div>`;
    const inner = squarify(g.files.slice().sort((a, b) => b.value - a.value),
                           g.x + 4, g.y + 8, Math.max(0, g.w - 8), Math.max(0, g.h - 14));
    inner.forEach((f) => {
      const color = f.sample ? colorFor(f.sample) : "#30363d";
      const label = f.w > 54 && f.h > 22
        ? `${esc(baseOf(f.path))}<br />${f.lines ? f.lines + " lines" : f.count + " nodes"}` : "";
      html += `<div class="tmf" data-file="${esc(f.path)}" title="${esc(f.path)} — ${f.count} node(s)"
        style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px;background:${color}">${label}</div>`;
    });
  });
  host.innerHTML = html;
  host.querySelectorAll("[data-file]").forEach((d) =>
    d.addEventListener("click", () => { showFile(d.dataset.file); setFilter(d.dataset.file); }));
}

// ---------------------------------------------------------------- selection
function computeHighlight(id) {
  const isBlast = el("blast").checked;
  const down = isBlast ? reach(id, outAdj).set : new Set(outAdj.get(id) || []);
  const up = isBlast ? reach(id, inAdj).set : new Set(inAdj.get(id) || []);
  highlightNodes = new Set([id, ...down, ...up]);
  highlightLinks = new Set();
  links.forEach((l) => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    if (s === id || t === id) highlightLinks.add(l);
    else if (isBlast && highlightNodes.has(s) && highlightNodes.has(t)) highlightLinks.add(l);
  });
}

function selectNode(id, recenter) {
  const node = byId.get(id);
  if (!node) return;
  selected = id;
  computeHighlight(id);
  showTab("file");
  renderFile(node);
  if (recenter && node.x != null && view !== "matrix" && view !== "treemap") {
    Graph.centerAt(node.x, node.y, 500); Graph.zoom(3, 500);
  }
  if (view === "matrix") renderMatrix();
  updateStatus(); repaint();
}

function clearSelection() {
  selected = null; highlightNodes.clear(); highlightLinks.clear();

      <span class="badge">${int} int</span>
      ${ext ? `<span class="badge med">${ext} ext</span>` : ""}</span></div>`;
}

function renderFile(node) {
  if (!node) return;
  const file = fileOf(node);
  const meta = filesIndex.get(file) || {};
  const up = reach(node.id, inAdj), down = reach(node.id, outAdj);
  const affected = up.set.size;
  const pct = nodes.length ? Math.round(100 * affected / nodes.length) : 0;
  const [sevCls, sevLabel] = severityOfImpact(pct);
  const m = metrics(node.id);
  const issues = issuesByNode.get(node.id) || [];
  const siblings = (meta.nodes || []).map((id) => byId.get(id))
    .sort((a, b) => (lineOf(a) || 0) - (lineOf(b) || 0));

  const parts = [backLink()];
  parts.push(`<h2 class="node mono">${esc(node.id)}</h2>
    <div class="sub">${esc(file)}${meta.lines ? ` · ${meta.lines} lines` : ""}
      ${lineOf(node) ? ` · line ${lineOf(node)}` : ""}</div>
    <div class="chips">
      <span class="chip"><i style="background:${colorFor(node)}"></i>${esc(node.kind || "node")}</span>
      ${node.layer ? `<span class="chip">${esc(node.layer)}</span>` : ""}
      ${node.cls ? `<span class="chip">${esc(node.cls)}</span>` : ""}
      ${node.lang ? `<span class="chip">${esc(node.lang)}</span>` : ""}
    </div>`);
  if (node.doc) parts.push(`<p class="doc">${renderDoc(node.doc)}</p>`);
  if (node.signature) parts.push(`<p class="doc mono" style="color:var(--muted)">${esc(node.signature)}</p>`);
  if (node.route) parts.push(`<p class="doc"><span class="badge low">${esc(node.route.method)}</span>
    <code>${esc(node.route.path)}</code></p>`);

  parts.push(`<details class="acc" open><summary>💥 Blast radius
      <span class="grow badge ${sevCls}">${sevLabel}</span></summary>
    <div class="body">
      <div class="kv"><span>Impact</span><b>${affected} node(s) (${pct}%)</b></div>
      <div class="meter"><i style="width:${Math.min(100, pct)}%"></i></div>
      <div class="sub">Changes here propagate up to ${up.depth} level(s) of callers, and this node
        reaches ${down.set.size} node(s) downstream.</div>
      <div class="grp">Affected nodes</div>
      <div class="list">${[...up.set].slice(0, 12).map(nodeItem).join("") ||
        '<span class="empty">Nothing depends on this node.</span>'}</div>
      ${up.set.size > 12 ? `<div class="sub">+${up.set.size - 12} more</div>` : ""}
    </div></details>`);

  parts.push(`<details class="acc"><summary>🔗 Connections
      <span class="grow badge">${degree(node.id)}</span></summary>
    <div class="body">
      <div class="grp">${OUT_LABEL}</div>
      <div class="list">${(outAdj.get(node.id) || []).map(nodeItem).join("") || '<span class="empty">None</span>'}</div>
      <div class="grp">${IN_LABEL}</div>
      <div class="list">${(inAdj.get(node.id) || []).map(nodeItem).join("") || '<span class="empty">None</span>'}</div>
    </div></details>`);

  parts.push(`<details class="acc"><summary>👥 Ownership
      <span class="grow badge">${m.commits != null ? m.commits + " commits" : "n/a"}</span></summary>
    <div class="body">${m.commits ? `
      <div class="kv"><span>Owner</span><b>${esc(m.owner || "unknown")}</b></div>
      <div class="kv"><span>Commits</span><b>${m.commits}</b></div>
      <div class="kv"><span>Risk (churn x links)</span><b>${m.risk}</b></div>
      <div class="kv"><span>Last change</span><b>${esc((m.last_commit || "").slice(0, 10) || "—")}</b></div>
      <div class="grp">Contributors</div>
      ${Object.entries(m.authors || {}).map(([a, c]) =>
        `<div class="kv"><span>${esc(a)}</span><b>${c}</b></div>`).join("") || '<span class="empty">—</span>'}`
      : '<span class="empty">No git history for this file (run the report inside a git repo).</span>'}
    </div></details>`);

  parts.push(`<details class="acc" ${issues.length ? "open" : ""}><summary>🔒 Risk findings
      <span class="grow badge ${issues.length ? "high" : ""}">${issues.length}</span></summary>
    <div class="body">${issues.map(issueRow).join("") || '<span class="empty">None on this node.</span>'}</div>
    </details>`);

  parts.push(`<details class="acc"><summary>⚡ Functions in this file
      <span class="grow badge">${siblings.length}</span></summary>
    <div class="body"><div class="list">${siblings.map((s) => nodeItem(s.id)).join("")}</div></div>
    </details>`);

  el("panel").innerHTML = parts.join("");
  wireBack();
}

function showFile(path) {
  const meta = filesIndex.get(path);
  const first = meta && meta.nodes.length ? meta.nodes[0] : null;
  if (first) return selectNode(first, true);
  // File with no nodes (e.g. a module-level finding): show what we know.
  showTab("file");
  el("panel").innerHTML = backLink() + `<h2 class="node mono">${esc(baseOf(path))}</h2>
    <div class="sub">${esc(path)}</div>
    <div class="body">${(issuesByFile.get(path) || []).map(issueRow).join("") ||
      '<span class="empty">No nodes or findings recorded for this file.</span>'}</div>`;
  wireBack();
}

function renderDoc(text) {
  return esc(text || "").replace(/\[\[(.*?)\]\]/g, (_, id) =>
    byId.has(id) ? `<span class="link" data-goto="${esc(id)}">${esc(id)}</span>` : esc(id));
}

function issueRow(f) {
  return `<div class="issue ${SEV_CLASS[f.severity]}" ${f.node ? `data-goto="${esc(f.node)}"` : `data-file="${esc(f.file)}"`}>
    <span class="badge ${SEV_CLASS[f.severity]}">${esc(f.severity)}</span> ${esc(f.message)}
    <div class="m mono">${esc(f.file)}:${f.line}${f.node ? ` · ${esc(f.node)}` : ""}</div>
    <div class="m mono">${esc(f.snippet || "")}</div></div>`;
}

function renderSecurity() {
  const bySev = { high: [], medium: [], low: [] };
  FINDINGS.forEach((f) => bySev[f.severity].push(f));
  const body = Object.entries(bySev).filter(([, v]) => v.length).map(([sev, list]) =>
    `<div class="grp">${sev} — ${list.length}</div>${list.map(issueRow).join("")}`).join("");
  el("panel").innerHTML = `<h2 class="node">Security &amp; risk</h2>
    <div class="sub">${FINDINGS.length} finding(s) from the deterministic scan
      ${REPORT.security ? `· ${REPORT.security.summary.files_scanned} file(s) scanned` : ""}</div>
    ${body || '<p class="empty">No findings — or no report embedded in this page.</p>'}`;
  el("panel").querySelectorAll("[data-goto]").forEach((x) => x.addEventListener("click", () => {
    backTo = "Issues"; selectNode(x.dataset.goto, true);
  }));
  el("panel").querySelectorAll("[data-file]").forEach((x) => x.addEventListener("click", () => {
    backTo = "Issues"; showFile(x.dataset.file);
  }));
}

function renderPatterns() {
  const sections = [];
  const idioms = ANALYSIS.patterns || {};
  const push = (title, items, render) => {
    if (!items || !items.length) return;
    sections.push(`<div class="grp">${title} — ${items.length}</div>` + items.map(render).join(""));
  };
  push("Circular dependencies", ANALYSIS.cycles || [], (c) =>
    `<div class="item" data-goto="${esc(c[0])}"><span class="mono link">${c.map(esc).join(" → ")}</span></div>`);
  push("Backwards layer dependencies", ANALYSIS.layer_violations || [], (v) =>
    `<div class="item" data-goto="${esc(v.source)}"><span class="mono link">${esc(v.source)} → ${esc(v.target)}</span>
      <span class="grow"><span class="badge med">${esc(v.from)}→${esc(v.to)}</span></span></div>`);
  push("High coupling (hubs)", ANALYSIS.hubs || [], (h) =>
    `<div class="item" data-goto="${esc(h.node)}"><span class="mono link">${esc(h.node)}</span>
      <span class="grow"><span class="badge">${h.fan_in} in</span><span class="badge">${h.fan_out} out</span></span></div>`);
  push("God objects", ANALYSIS.god_objects || [], (g) =>
    `<div class="item"><span class="mono">${esc(g.name)}</span>
      <span class="grow"><span class="badge med">${g.count} ${esc(g.reason)}</span></span></div>`);
  push("Dead / unused nodes", ANALYSIS.orphans || [], (o) => nodeItem(o));
  Object.entries(idioms).forEach(([name, ids]) =>
    push(name.replace(/_/g, " "), ids, (id) => nodeItem(id)));

  el("panel").innerHTML = `<h2 class="node">Patterns &amp; smells</h2>
    <div class="sub">Deterministic graph checks${HEALTH ? ` · grade ${HEALTH.grade} (${HEALTH.score}/100)` : ""}</div>
    ${sections.join("") || '<p class="empty">Nothing flagged — or no report embedded in this page.</p>'}`;
  el("panel").querySelectorAll("[data-goto]").forEach((x) => x.addEventListener("click", () => {
    backTo = "Patterns"; selectNode(x.dataset.goto, true);
  }));
}

renderTabs(); renderPanel();

// ---------------------------------------------------------------- controls
el("zoomIn").addEventListener("click", () => Graph.zoom(Graph.zoom() * 1.4, 250));
el("zoomOut").addEventListener("click", () => Graph.zoom(Graph.zoom() / 1.4, 250));
el("zoomFit").addEventListener("click", () => Graph.zoomToFit(400, 60));
el("reset").addEventListener("click", () => { setFilter(null); clearSelection(); Graph.zoomToFit(400, 60); });
el("hulls").addEventListener("change", repaint);
el("blast").addEventListener("change", () => {
  if (selected) { computeHighlight(selected); repaint(); }
});
el("png").addEventListener("click", () => {
  const canvas = el("graph").querySelector("canvas") || el("matrix");
  const a = document.createElement("a");
  a.download = (document.title || "graph").replace(/\W+/g, "_") + ".png";
  a.href = canvas.toDataURL("image/png");
  a.click();
});

const search = el("search");
search.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const term = search.value.trim().toLowerCase();
  const hit = nodes.find((n) => n.id.toLowerCase().includes(term));
  if (hit) selectNode(hit.id, true);
});
window.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== search) { e.preventDefault(); search.focus(); }
  else if (e.key === "Escape") { clearSelection(); search.blur(); }
});

const stage = el("stage");
const fit = () => {
  Graph.width(stage.clientWidth).height(stage.clientHeight);
  if (view === "matrix") renderMatrix();
  if (view === "treemap") renderTreemap();
};
new ResizeObserver(fit).observe(stage);
fit();
setTimeout(() => Graph.zoomToFit(600, 60), 600);
</script>
</body>
</html>
